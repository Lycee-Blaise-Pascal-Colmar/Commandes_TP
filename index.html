<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda des commandes TP — SVT/STL</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('agenda-tp-theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
    }catch(e){}
  })();
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F4A40'/%3E%3Cg fill='none' stroke='%23EDEFE9' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 5h6'/%3E%3Cpath d='M14 5v7.8L7.8 24.6c-.7 1.2.2 2.7 1.6 2.7h13.2c1.4 0 2.3-1.5 1.6-2.7L18 12.8V5'/%3E%3Cpath d='M10.5 19.5h11'/%3E%3C/g%3E%3Ccircle cx='19.5' cy='22.5' r='1.1' fill='%23EDEFE9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFE9; --paper-line:#D6DACC; --ink:#1E2B24; --ink-soft:#52604F; --ink-faint:#8A9184;
    --card:#F7F8F3; --surface:#ffffff; --teal:#2F6B5E; --teal-dark:#1F4A40; --teal-pale:#DCEAE5;
    --amber:#B9791E; --amber-pale:#F3E4C8; --rust:#A6452F; --rust-pale:#F1DCD3; --border:#C7CDBB;
  }
  html[data-theme="dark"]{
    --paper:#242B25; --paper-line:#343E36; --ink:#EDF0E8; --ink-soft:#B7C0AF; --ink-faint:#828C7A;
    --card:#2B332C; --surface:#313A32; --teal:#5AA292; --teal-dark:#3A7A6B; --teal-pale:#374238;
    --amber:#DFAE66; --amber-pale:#453820; --rust:#E28B6C; --rust-pale:#45291F; --border:#4A5449;
  }
  html[data-theme="dark"] .modal, html[data-theme="dark"] .login-box{
    box-shadow:0 12px 32px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 100% 28px, 28px 100%;
    background-position: 0 0, 0 0;
    background-attachment: fixed;
    transition:background-color .15s ease, color .15s ease;
  }
  body::before{content:none;}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px;position:relative;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:30px;flex-wrap:wrap;gap:12px;
    position:relative;
  }
  header.top::after{
    content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--ink);opacity:0.35;
  }
  header.top .brand{display:flex;align-items:center;gap:12px;}
  header.top .brand svg{flex:none;color:var(--teal-dark);}
  header.top h1{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;margin:0;letter-spacing:-0.01em;}
  header.top .sub{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .conn-status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);}
  .conn-status.ok{color:var(--teal-dark);}
  .conn-status.err{color:var(--rust);}
  .top-right{display:flex;align-items:center;gap:14px;}
  .top-action-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);
    background:none;border:none;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
  }
  .top-action-btn:hover{color:var(--ink-soft);}

  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;
  }
  .login-box{
    background:var(--card);border:1px solid var(--border);border-radius:6px;padding:28px 26px;
    width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px;
    box-shadow:0 2px 0 var(--border);
  }
  .login-box h2{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin:0 0 4px;}
  .login-box .login-sub{font-size:14px;color:var(--ink-soft);margin:0 0 14px;}
  .login-box label{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .login-box input{
    font-family:'IBM Plex Sans',sans-serif;font-size:15px;padding:9px 10px;border:1px solid var(--border);
    border-radius:4px;background:var(--paper);color:var(--ink);
  }
  .login-box button{
    margin-top:16px;padding:10px;border:none;border-radius:4px;background:var(--teal-dark);color:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;cursor:pointer;
  }
  .login-box button:hover{background:var(--teal);}
  .login-box .err{color:var(--rust);font-size:13px;margin-top:8px;}

  .prof-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .prof-legend span{display:inline-flex;align-items:center;gap:5px;}
  .prof-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    font-family:'IBM Plex Mono',monospace;font-size:15px;background:var(--card);
    border:1px solid var(--border);padding:6px 12px;cursor:pointer;color:var(--ink);transition:border-color .12s ease, background .12s ease;
  }
  .month-nav button:hover{border-color:var(--teal);background:var(--teal-pale);}
  .month-title{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;min-width:180px;text-align:center;text-transform:capitalize;}
  .view-toggle{display:flex;border:1px solid var(--border);}
  .view-toggle button{
    font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--card);
    border:none;padding:7px 14px;cursor:pointer;color:var(--ink-soft);
  }
  .view-toggle button.active{background:var(--teal-dark);color:#fff;}

  /* Calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1.35fr)) repeat(2,minmax(0,0.5fr));border-left:1px solid var(--border);border-top:1px solid var(--border);}
  .cal-dow{
    font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--ink-soft);padding:6px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    background:var(--card);min-width:0;
  }
  .cal-cell{
    min-height:96px;min-width:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:6px 6px 8px;background:var(--surface);cursor:pointer;position:relative;transition:background .12s ease;
  }
  .cal-cell:hover{background:var(--teal-pale);}
  .cal-cell.other-month{background:var(--paper);color:var(--ink-faint);}
  .cal-cell.weekend{background:var(--paper);}
  .cal-cell.weekend .cal-daynum{color:var(--ink-faint);}
  .cal-cell.vacances{background:repeating-linear-gradient(135deg, var(--paper) 0px, var(--paper) 9px, var(--paper-line) 9px, var(--paper-line) 10px);}
  .cal-cell.ferie{background:var(--amber-pale);}
  .cal-cell.ferie .cal-daynum{color:var(--amber);}
  .cal-ferie-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-vacances-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.03em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--teal);}
  .cal-cell.today .cal-daynum{color:var(--teal-dark);}
  .cal-cell.locked{
    background:repeating-linear-gradient(135deg, var(--paper) 0px, var(--paper) 6px, var(--paper-line) 6px, var(--paper-line) 7px);
  }
  .cal-cell.locked:hover{background:repeating-linear-gradient(135deg, var(--teal-pale) 0px, var(--teal-pale) 6px, var(--border) 6px, var(--border) 7px);}
  .cal-cell.locked .cal-daynum{color:var(--ink-faint);}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;}
  .cal-badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;
    margin-left:5px;padding:0 4px;border-radius:8px;background:var(--teal-dark);color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;vertical-align:2px;
  }
  .cal-tag[draggable="true"]{cursor:grab;}
  .cal-tag.dragging{opacity:.4;}
  .cal-cell.drop-target{background:var(--amber-pale)!important;box-shadow:inset 0 0 0 2px var(--amber);}
  .cal-cell.drop-target.drop-copy{background:var(--teal-pale)!important;box-shadow:inset 0 0 0 2px var(--teal);}

  .order-tooltip{
    position:fixed;z-index:500;width:260px;max-width:calc(100vw - 24px);background:var(--surface);
    border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.2);
    padding:10px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:var(--ink);
    pointer-events:none;opacity:0;transform:translateY(4px);
    transition:opacity .1s ease, transform .1s ease;
  }
  .order-tooltip.visible{opacity:1;transform:translateY(0);}
  .order-tooltip .ot-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .order-tooltip .ot-title{font-weight:600;font-size:14px;margin-bottom:2px;}
  .order-tooltip .ot-meta{color:var(--ink-soft);margin-bottom:6px;}
  .order-tooltip ul{margin:0 0 0;padding-left:16px;}
  .order-tooltip li{line-height:1.45;}
  .order-tooltip li.ot-more{color:var(--ink-faint);list-style:none;margin-left:-16px;}
  .order-tooltip .ot-notes{margin-top:6px;padding-top:6px;border-top:1px solid var(--paper-line);color:var(--ink-soft);}
  .order-tooltip .ot-prepared{display:inline-block;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-dark);}
  @media (max-width:700px){ .order-tooltip{display:none!important;} }

  .ctx-menu{
    position:fixed;z-index:600;min-width:170px;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.22);padding:4px;font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;display:none;
  }
  .ctx-menu.visible{display:block;}
  .ctx-menu button{
    display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;background:none;
    border-radius:4px;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;font-size:inherit;
  }
  .ctx-menu button:hover{background:var(--paper-line);}
  .ctx-menu button.danger{color:var(--red,#b3311b);}
  .ctx-menu button.danger:hover{background:rgba(179,49,27,0.1);}
  .ctx-menu .ctx-header{padding:6px 10px 8px;font-size:11.5px;color:var(--ink-faint);border-bottom:1px solid var(--paper-line);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .cal-add-btn{
    position:absolute;top:4px;right:4px;width:18px;height:18px;line-height:16px;text-align:center;
    border:1px solid var(--border);border-radius:3px;background:var(--card);color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;cursor:pointer;padding:0;
    opacity:0;transition:opacity .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
    z-index:2;
  }
  .cal-cell:hover .cal-add-btn{opacity:1;}
  .cal-add-btn:hover{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);}
  @media (max-width:700px){ .cal-add-btn{opacity:1;top:2px;right:2px;width:16px;height:16px;line-height:14px;font-size:11px;} }
  .cal-tags{margin-top:4px;display:flex;flex-direction:column;gap:2px;}
  .cal-tag{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:2px 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--teal);
    background:var(--teal-pale);color:var(--teal-dark);
  }
  .cal-tag.prepared{opacity:.55;text-decoration:line-through;}
  .cal-more{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:2px;}

  @media (max-width:700px){
    .cal-cell{min-height:64px;padding:4px;}
    .cal-tag{font-size:10px;}
  }

  /* List / agenda view */
  .agenda-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .prepare-count{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink-soft);margin-right:auto;}
  .prepare-nav{align-items:center;}
  .prepare-nav #prepare-prev-week, .prepare-nav #prepare-next-week{
    font-family:'IBM Plex Mono',monospace;font-size:16px;background:var(--card);
    border:1px solid var(--border);padding:6px 12px;cursor:pointer;color:var(--ink);transition:border-color .12s ease, background .12s ease;
  }
  .prepare-nav #prepare-prev-week:hover, .prepare-nav #prepare-next-week:hover{border-color:var(--teal);background:var(--teal-pale);}
  .prepare-week-label{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;text-align:center;min-width:220px;}
  .prepare-week-label .link-btn{
    display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:11.5px;color:var(--ink-faint);
    background:none;border:none;text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin:2px auto 0;
  }
  .prepare-week-label .link-btn:hover{color:var(--ink-soft);}
  .cat-lowstock-toggle{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;}
  .cat-lowstock-toggle input{width:15px;height:15px;cursor:pointer;accent-color:var(--rust);}
  #cat-search{padding:7px 10px;border:1px solid var(--border);font-family:'IBM Plex Sans',sans-serif;font-size:14px;min-width:180px;}
  .agenda-filters select{font-family:'IBM Plex Mono',monospace;font-size:13.5px;padding:7px 8px;border:1px solid var(--border);background:var(--card);}
  .download-btn{
    font-family:'IBM Plex Mono',monospace;font-size:13.5px;padding:7px 12px;
    border:1px solid var(--teal-dark);background:var(--teal-dark);color:#fff;cursor:pointer;margin-left:auto;
  }
  .download-btn:hover{background:var(--teal);}
  .month-heading{
    font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.06em;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .month-heading:first-child{margin-top:0;}
  .cat-group-heading{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--teal-dark);
    text-transform:uppercase;letter-spacing:0.06em;padding:8px 12px;background:var(--teal-pale);
    display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  }
  .cat-group-heading:hover{filter:brightness(0.97);}
  .cat-group-arrow{display:inline-block;font-size:10px;transition:transform .15s ease;transform:rotate(90deg);}
  .cat-group-heading.collapsed .cat-group-arrow{transform:rotate(0deg);}
  .cat-group-count{margin-left:auto;font-weight:500;opacity:0.75;text-transform:none;letter-spacing:normal;}
  .cat-group-rename{
    font-size:12px;background:none;border:none;cursor:pointer;padding:2px 4px;opacity:0.65;line-height:1;
  }
  .cat-group-rename:hover{opacity:1;}
  .cat-toggle-all{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:none;border:1px solid var(--border);
    color:var(--ink-soft);padding:4px 9px;cursor:pointer;border-radius:3px;
  }
  .cat-toggle-all:hover{background:var(--teal-pale);color:var(--teal-dark);}
  .slip{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--border);margin-bottom:14px;padding:14px 16px 12px;box-shadow:0 1px 2px rgba(30,43,36,0.06), 0 5px 12px rgba(30,43,36,0.05);}
  .slip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
  .slip-date{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}
  .slip-meta{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  .slip-meta b{color:var(--ink);font-weight:500;}
  .items-list{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--paper-line);}
  .items-list li{display:flex;justify-content:space-between;padding:5px 0;font-size:14.5px;border-bottom:1px dotted var(--paper-line);}
  .items-list li .qty{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:13.5px;margin-left:10px;white-space:nowrap;}
  .notes{margin-top:8px;font-size:14px;color:var(--ink-soft);font-style:italic;}
  .slip-prepare{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;flex:none;padding:4px 9px;border:1px solid var(--border);border-radius:3px;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .slip-prepare input{width:15px;height:15px;cursor:pointer;accent-color:var(--teal-dark);}
  .slip.prepared .slip-prepare{color:#fff;font-weight:600;background:var(--teal-dark);border-color:var(--teal-dark);}
  .slip.prepared .items-list{opacity:0.6;}
  .slip.prepared{box-shadow:0 1px 2px rgba(30,43,36,0.06), 0 5px 12px rgba(30,43,36,0.05), inset 0 0 0 1px var(--teal-dark);}
  .slip{border-left:4px solid var(--border);}
  .slip-actions{margin-top:10px;display:flex;gap:14px;}
  .slip-actions button{background:none;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-faint);padding:0;}
  .slip-actions button:hover{color:var(--rust);}
  .slip-actions button[data-action="duplicate"]:hover{color:var(--teal-dark);}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:14px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(30,43,36,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadeIn .15s ease;}
  .modal{background:var(--surface);color:var(--ink);border:1px solid var(--border);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px 24px;box-shadow:0 12px 32px rgba(30,43,36,0.18);animation:riseIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .modal h2{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin:0 0 4px;text-transform:capitalize;}
  .modal-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;margin-bottom:14px;}
  .close-btn{background:none;border:none;font-size:19px;cursor:pointer;color:var(--ink-faint);line-height:1;}
  .close-btn:hover{color:var(--rust);}
  .modal-section-label{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin:18px 0 8px;}
  .modal-section-label:first-of-type{margin-top:0;}

  label{display:block;font-size:13px;color:var(--ink-soft);margin:0 0 4px;font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  input[type=text],input[type=number],select,textarea{
    width:100%;border:1px solid var(--border);background:var(--surface);padding:8px 9px;font-size:15px;
    font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);}
  textarea{resize:vertical;min-height:48px;}
  .rte-wrap{border:1px solid var(--border);background:var(--surface);}
  .rte-toolbar{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--border);background:var(--paper);}
  .rte-btn{
    width:28px;height:26px;border:1px solid transparent;background:none;border-radius:2px;
    cursor:pointer;color:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;font-size:13px;
  }
  .rte-btn:hover{border-color:var(--border);background:var(--surface);color:var(--ink);}
  .rte-editor{

const MIN_LEAD_DAYS = 2; // délai minimum, en JOURS OUVRÉS, entre le dépôt d'une commande et la date du TP

function minOrderableIso(){
  const d = new Date();
  let restant = MIN_LEAD_DAYS;
  while(restant > 0){
    d.setDate(d.getDate() + 1);
    const dow = d.getDay(); // 0=dimanche, 6=samedi
    if(dow !== 0 && dow !== 6) restant--;
  }
  return isoDate(d);
}
function isOrderable(iso){
  return iso >= minOrderableIso();
}

function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayIso(){ return isoDate(new Date()); }

/* ---------- Jours fériés (Alsace-Moselle) et vacances scolaires (zone B) ---------- */

function easterSunday(year){
  // Algorithme de Meeus/Jones/Butcher
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l)/451);
  const month = Math.floor((h + l - 7*m + 114)/31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month-1, day);
}

const _joursFeriesCache = {};
function joursFeriesAnnee(year){
  if(_joursFeriesCache[year]) return _joursFeriesCache[year];
  const paques = easterSunday(year);
  const decale = (n)=>{ const d = new Date(paques); d.setDate(d.getDate()+n); return d; };
  const entries = [
    [new Date(year,0,1), "Jour de l'an"],
    [decale(-2), "Vendredi saint"], // spécifique Alsace-Moselle
    [decale(1), "Lundi de Pâques"],
    [new Date(year,4,1), "Fête du Travail"],
    [new Date(year,4,8), "Victoire 1945"],
    [decale(39), "Ascension"],
    [decale(50), "Lundi de Pentecôte"],
    [new Date(year,6,14), "Fête nationale"],
    [new Date(year,7,15), "Assomption"],
    [new Date(year,10,1), "Toussaint"],
    [new Date(year,10,11), "Armistice"],
    [new Date(year,11,25), "Noël"],
    [new Date(year,11,26), "Saint-Étienne"], // spécifique Alsace-Moselle
  ];
  const map = {};
  entries.forEach(([d,label])=>{ map[isoDate(d)] = label; });
  _joursFeriesCache[year] = map;
  return map;
}
function jourFerieLabel(iso){
  const year = Number(iso.slice(0,4));
  return joursFeriesAnnee(year)[iso] || joursFeriesAnnee(year+1)[iso] || joursFeriesAnnee(year-1)[iso] || null;
}

function vacanceInfo(iso){
  // Le dernier jour de classe et le jour de reprise ne sont pas des jours de vacances : on exclut les bornes.
  for(const v of VACANCES_ZONE_B){
    if(iso > v.debut && iso < v.fin) return v;
  }
  return null;
}

function unsubscribeAll(){
  if(unsubscribeOrders){ unsubscribeOrders(); unsubscribeOrders = null; }
  if(unsubscribeCatalogue){ unsubscribeCatalogue(); unsubscribeCatalogue = null; }
  if(unsubscribeProtocoles){ unsubscribeProtocoles(); unsubscribeProtocoles = null; }
}

function connectRealtime(){
  const statusEl = document.getElementById('conn-status');
  unsubscribeAll();
  unsubscribeOrders = ordersCol.onSnapshot(
    snap=>{
      const all = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      orders = all.filter(o=>!o.supprime);
      ordersTrash = all.filter(o=>o.supprime);
      statusEl.textContent = 'Connecté — mise à jour en temps réel';
      statusEl.className = 'conn-status ok';
      render();
      purgeExpiredTrash();
    },
    err=>{
      console.error(err);
      statusEl.textContent = 'Connexion Firebase impossible — vérifiez firebaseConfig et les règles Firestore';
      statusEl.className = 'conn-status err';
      document.getElementById('content').innerHTML = '<div class="empty">Impossible de charger les commandes.<br>Vérifiez la configuration Firebase dans index.html.</div>';
    }
  );
  unsubscribeCatalogue = catalogueCol.orderBy('nom').onSnapshot(
    snap=>{
      const all = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      catalogue = all.filter(it=>!it.supprime);
      catalogueTrash = all.filter(it=>it.supprime);
      if(currentView==='catalogue' || currentView==='corbeille') render();
      updateMaterielDatalist();
      purgeExpiredTrash();
    },
    err=>{ console.error('Erreur catalogue:', err); }
  );
  unsubscribeProtocoles = protocolesCol.orderBy('titre').onSnapshot(
    snap=>{
      const all = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      protocoles = all.filter(p=>!p.supprime);
      protocolesTrash = all.filter(p=>p.supprime);
      if(currentView==='protocoles' || currentView==='corbeille') render();
      purgeExpiredTrash();
    },
    err=>{ console.error('Erreur protocoles:', err); }
  );
}

let purgeInFlight = false;
async function purgeExpiredTrash(){
  if(purgeInFlight) return;
  purgeInFlight = true;
  try{
    const cutoff = Date.now() - TRASH_RETENTION_DAYS*24*60*60*1000;
    for(const o of ordersTrash){
      if((o.supprimeLe||0) < cutoff) await deleteOrderAndRestoreStock(o);
    }
    for(const it of catalogueTrash){
      if((it.supprimeLe||0) < cutoff) await catalogueCol.doc(it.id).delete().catch(e=>console.error(e));
    }
    for(const p of protocolesTrash){
      if((p.supprimeLe||0) < cutoff) await protocolesCol.doc(p.id).delete().catch(e=>console.error(e));
    }
  } finally {
    purgeInFlight = false;
  }
}

}
function fmtDateShort(iso){

function findCatalogueMatch(itemName){
  return catalogue.find(c=>(c.nom||'').toLowerCase()===String(itemName||'').trim().toLowerCase());
}

function resolveItemRefs(items){
  return (items||[]).map(it=>{
    const match = findCatalogueMatch(it.name);
    return match ? { ref: catalogueCol.doc(match.id), qty: Number(it.qty)||0 } : null;
  }).filter(Boolean);
}

// Enregistre une nouvelle commande et décompte immédiatement le matériel correspondant du stock du catalogue.
async function createOrderAndDeductStock(orderData){
  const itemRefs = resolveItemRefs(orderData.items);
  const newOrderRef = ordersCol.doc();
  await db.runTransaction(async (tx)=>{
    const reads = await Promise.all(itemRefs.map(ir=>tx.get(ir.ref)));
    reads.forEach((snap, idx)=>{
      if(!snap.exists) return;
      const current = snap.data().quantite;
      const newQty = (current!=null ? current : 0) - itemRefs[idx].qty;
      tx.update(itemRefs[idx].ref, { quantite:newQty, updatedAt: Date.now() });
    });
    tx.set(newOrderRef, { ...orderData, stockDeducted:true, createdAt: Date.now() });
  });
}

// Met à jour une commande existante en ajustant le stock : restitue les anciennes quantités
// et décompte les nouvelles en une seule transaction (net par article si un article reste inchangé).
async function updateOrderAndAdjustStock(order, newData){
  const oldRefs = order.stockDeducted ? resolveItemRefs(order.items) : [];
  const newRefs = resolveItemRefs(newData.items);

  const netByPath = new Map();
  oldRefs.forEach(ir=>{
    const cur = netByPath.get(ir.ref.path) || { ref: ir.ref, delta: 0 };
    cur.delta += ir.qty;
    netByPath.set(ir.ref.path, cur);
  });
  newRefs.forEach(ir=>{
    const cur = netByPath.get(ir.ref.path) || { ref: ir.ref, delta: 0 };
    cur.delta -= ir.qty;
    netByPath.set(ir.ref.path, cur);
  });
  const entries = [...netByPath.values()].filter(e=>e.delta!==0);
  const orderRef = ordersCol.doc(order.id);

  await db.runTransaction(async (tx)=>{
    const reads = await Promise.all(entries.map(e=>tx.get(e.ref)));
    reads.forEach((snap, idx)=>{
      if(!snap.exists) return;
      const current = snap.data().quantite;
      const newQty = (current!=null ? current : 0) + entries[idx].delta;
      tx.update(entries[idx].ref, { quantite:newQty, updatedAt: Date.now() });
    });
    tx.update(orderRef, { ...newData, stockDeducted:true, updatedAt: Date.now() });
  });
}

// Déplace une commande existante vers une autre date (glisser-déposer dans le calendrier).
async function moveOrderToDate(order, newIso){
  try{
    await updateOrderAndAdjustStock(order, {
      prof: order.prof, date: newIso, classe: order.classe, horaire: order.horaire, salle: order.salle,
      items: order.items, notes: order.notes,
      protocoleTitre: order.protocoleTitre || null, protocoleLien: order.protocoleLien || null
    });
  }catch(err){
    console.error(err);
    alert("Le déplacement de la commande a échoué. Vérifiez la connexion et réessayez.");
  }
}

// Duplique une commande existante vers une autre date (glisser-déposer avec Ctrl/⌘/Alt enfoncé),
// sans toucher à la commande d'origine. Décompte à nouveau le stock, comme une commande indépendante.
async function duplicateOrderToDate(order, newIso){
  try{
    await createOrderAndDeductStock({
      prof: order.prof, date: newIso, classe: order.classe||'', horaire: order.horaire||'',
      salle: order.salle||'', items: order.items||[], notes: order.notes||'',
      protocoleTitre: order.protocoleTitre||null, protocoleLien: order.protocoleLien||null
    });
  }catch(err){
    console.error(err);
    alert("La duplication de la commande a échoué. Vérifiez la connexion et réessayez.");
  }
}

// Supprime une commande en restituant le stock déjà décompté, le cas échéant.
async function deleteOrderAndRestoreStock(order){
  if(!order.stockDeducted){
    try{ await ordersCol.doc(order.id).delete(); }
    catch(err){ console.error(err); alert("La suppression a échoué. Réessayez."); }
    return;
  }
  const itemRefs = resolveItemRefs(order.items);
  try{
    await db.runTransaction(async (tx)=>{
      const reads = await Promise.all(itemRefs.map(ir=>tx.get(ir.ref)));
      reads.forEach((snap, idx)=>{
        if(!snap.exists) return;
        const current = snap.data().quantite;
        const newQty = (current!=null ? current : 0) + itemRefs[idx].qty;
        tx.update(itemRefs[idx].ref, { quantite:newQty, updatedAt: Date.now() });
      });
      tx.delete(ordersCol.doc(order.id));
    });
  }catch(err){
    console.error(err);
    alert("La suppression a échoué. Réessayez.");
  }
}
async function emptyTrash(){
  try{
    for(const o of [...ordersTrash]) await deleteOrderAndRestoreStock(o);
    for(const it of [...catalogueTrash]) await catalogueCol.doc(it.id).delete();
    for(const p of [...protocolesTrash]) await protocolesCol.doc(p.id).delete();
  }catch(err){
    console.error(err);
    alert("Le vidage de la corbeille a échoué. Réessayez : " + (err && err.message ? err.message : err));
  }
}

function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Petit éditeur de texte enrichi (gras / italique / souligné) pour les remarques ---------- */
const RTE_ALLOWED_TAGS = { B:'b', STRONG:'b', I:'i', EM:'i', U:'u' };
function sanitizeRichText(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  function walk(node){
    let out = '';
    node.childNodes.forEach(child=>{
      if(child.nodeType===3){
        out += escapeHtml(child.nodeValue);
      }else if(child.nodeType===1){
        const tag = child.tagName;
        if(tag==='BR'){
          out += '<br>';
        }else if(RTE_ALLOWED_TAGS[tag]){
          out += `<${RTE_ALLOWED_TAGS[tag]}>${walk(child)}</${RTE_ALLOWED_TAGS[tag]}>`;
        }else if(tag==='DIV' || tag==='P'){
          // Les navigateurs insèrent souvent un <div>/<p> par ligne dans les zones éditables.
          out += (out ? '<br>' : '') + walk(child);
        }else{
          out += walk(child); // balise non reconnue : on garde le texte, on retire la balise
        }
      }
    });
    return out;
  }
  return walk(tmp).replace(/(<br>\s*)+$/,''); // pas de retours à la ligne vides en fin de texte
}
function richTextToPlain(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = (html || '').replace(/<br\s*\/?>/gi, '\n');
  return (tmp.textContent || '').trim();
}

let orderTooltipEl = null;
function ensureOrderTooltipEl(){
  if(!orderTooltipEl){
    orderTooltipEl = document.createElement('div');
    orderTooltipEl.className = 'order-tooltip';
    document.body.appendChild(orderTooltipEl);
  }
  return orderTooltipEl;
}
function renderOrderTooltipHtml(o){
  const items = o.items || [];
  const shownItems = items.slice(0,8);
  const extra = items.length - shownItems.length;
  const itemsHtml = shownItems.map(it=>`<li>${escapeHtml(it.name)}${it.qty?` — ${it.qty} ${escapeHtml(it.unit||'')}`:''}</li>`).join('');
  const notesPlain = o.notes ? richTextToPlain(o.notes) : '';
  const notesShort = notesPlain.length>150 ? notesPlain.slice(0,150)+'…' : notesPlain;
  return `
    <div class="ot-date">${capitalize(fmtDateLong(o.date))}${o.horaire?' · '+escapeHtml(o.horaire):''}</div>
    <div class="ot-title">${escapeHtml(o.prof)}</div>
    <div class="ot-meta">${[o.classe, o.salle?('Salle '+o.salle):null].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</div>
    ${itemsHtml ? `<ul>${itemsHtml}${extra>0?`<li class="ot-more">+${extra} autre(s)</li>`:''}</ul>` : '<div class="ot-meta">Aucun matériel renseigné</div>'}
    ${o.protocoleTitre ? `<div class="ot-notes">Protocole : ${escapeHtml(o.protocoleTitre)}</div>` : ''}
    ${notesShort ? `<div class="ot-notes">${escapeHtml(notesShort)}</div>` : ''}
    ${o.prepared ? `<div class="ot-prepared">✓ Préparé</div>` : ''}
    <div class="ot-notes" style="font-style:italic;">Glisser pour déplacer · Ctrl/⌘/Alt + glisser pour dupliquer</div>
  `;
}
function showOrderTooltip(order, anchorEl){
  const el = ensureOrderTooltipEl();
  el.innerHTML = renderOrderTooltipHtml(order);
  el.classList.add('visible');
  positionOrderTooltip(el, anchorEl);
}
function positionOrderTooltip(el, anchorEl){
  const rect = anchorEl.getBoundingClientRect();
  const margin = 8;
  // Mesure la bulle une fois affichée (mais toujours transparente le temps du calcul)
  const w = el.offsetWidth, h = el.offsetHeight;
  let top = rect.bottom + margin;
  if(top + h > window.innerHeight - margin){ top = rect.top - h - margin; } // pas de place en dessous : on passe au-dessus
  if(top < margin) top = margin;
  let left = rect.left;
  if(left + w > window.innerWidth - margin){ left = window.innerWidth - margin - w; }
  if(left < margin) left = margin;
  el.style.top = top + 'px';
  el.style.left = left + 'px';
}
function hideOrderTooltip(){
  if(orderTooltipEl) orderTooltipEl.classList.remove('visible');
}
window.addEventListener('scroll', hideOrderTooltip, true);

/* ---------- Menu contextuel (clic droit / appui long) sur une commande ---------- */
let ctxMenuEl = null;
function ensureCtxMenuEl(){
  if(!ctxMenuEl){
    ctxMenuEl = document.createElement('div');
    ctxMenuEl.className = 'ctx-menu';
    document.body.appendChild(ctxMenuEl);
  }
  return ctxMenuEl;
}
function hideCtxMenu(){
  if(ctxMenuEl) ctxMenuEl.classList.remove('visible');
}
function showCtxMenu(order, x, y){
  hideOrderTooltip();
  const el = ensureCtxMenuEl();
  el.innerHTML = `
    <div class="ctx-header">${escapeHtml(order.prof)} · ${capitalize(fmtDateShort(order.date))}</div>
    <button type="button" data-act="edit">✏️ Modifier</button>
    <button type="button" data-act="duplicate">📋 Dupliquer</button>
    <button type="button" data-act="delete" class="danger">🗑️ Supprimer</button>
  `;
  el.classList.add('visible');
  // Position au point de clic/appui, en restant dans la fenêtre visible
  const margin = 6;
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = x, top = y;
  if(left + w > window.innerWidth - margin) left = window.innerWidth - margin - w;
  if(top + h > window.innerHeight - margin) top = window.innerHeight - margin - h;
  if(left < margin) left = margin;
  if(top < margin) top = margin;
  el.style.left = left + 'px';
  el.style.top = top + 'px';

  el.querySelector('[data-act="edit"]').addEventListener('click', ()=>{
    hideCtxMenu();
    openEditOrderModal(order);
  });
  el.querySelector('[data-act="duplicate"]').addEventListener('click', ()=>{
    hideCtxMenu();
    openDuplicateModal(order);
  });
  el.querySelector('[data-act="delete"]').addEventListener('click', async ()=>{
    hideCtxMenu();
    if(confirm('Mettre cette commande à la corbeille ? Vous pourrez la restaurer, ou elle sera supprimée définitivement (et le matériel restitué au stock) après 30 jours.')){
      await softDeleteOrder(order);
    }
  });
}
document.addEventListener('click', (e)=>{
  if(ctxMenuEl && ctxMenuEl.classList.contains('visible') && !ctxMenuEl.contains(e.target)) hideCtxMenu();
});
window.addEventListener('scroll', hideCtxMenu, true);

  (root||document).querySelectorAll('.rte-btn').forEach(btn=>{
    btn.addEventListener('mousedown', e=> e.preventDefault()); // ne pas perdre la sélection dans l'éditeur
    btn.addEventListener('click', ()=>{
      const target = document.getElementById(btn.getAttribute('data-target'));
      if(target){ target.focus(); document.execCommand(btn.getAttribute('data-cmd'), false, null); }
    });
  });
}

const HORAIRE_TIMES = (()=>{
  const opts = [];
  for(let h=8;h<=18;h++){
    opts.push(h+'h');
  }
  return opts;
})();
function timeOptionsHtml(selectId, selectedVal){
  return `<option value="">–</option>` + HORAIRE_TIMES.map(t=>`<option value="${t}" ${t===selectedVal?'selected':''}>${t}</option>`).join('');
}
function parseHoraire(horaire){
  if(!horaire) return {debut:'', fin:''};
  const parts = String(horaire).split(/\s*(?:-|–|à)\s*/).map(s=>s.trim()).filter(Boolean);
  if(parts.length===2 && HORAIRE_TIMES.includes(parts[0]) && HORAIRE_TIMES.includes(parts[1])){
    return {debut:parts[0], fin:parts[1]};
  }
  return {debut:'', fin:''};
}
function combineHoraire(debut, fin){
  if(debut && fin) return `${debut} – ${fin}`;
  return debut || fin || '';
}

function ordersByDate(iso){
  return orders.filter(o=>o.date===iso).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
function getCatalogueCategories(){
  const fromCatalogue = catalogue.map(it=>it.categorie).filter(Boolean);
  return Array.from(new Set([...CATEGORIES, ...fromCatalogue])).sort((a,b)=>a.localeCompare(b,'fr'));
}

function render(){
  document.getElementById('month-title').textContent = capitalize(fmtMonthTitle(cursor));
  document.getElementById('month-title').style.display = currentView==='cal' ? '' : 'none';
  document.getElementById('prev-month').style.display = currentView==='cal' ? '' : 'none';
  document.getElementById('next-month').style.display = currentView==='cal' ? '' : 'none';
  document.getElementById('today-btn').style.display = currentView==='cal' ? '' : 'none';
  document.getElementById('print-week-btn').style.display = currentView==='cal' ? '' : 'none';
  let html;
  if(currentView==='cal') html = renderCalendar();
  else if(currentView==='agenda') html = renderAgenda();
  else if(currentView==='parprof') html = renderParEnseignant();
  else if(currentView==='recherche') html = renderRecherche();
  else if(currentView==='prepare') html = renderPrepare();
  else if(currentView==='catalogue') html = renderCatalogue();
  else if(currentView==='corbeille') html = renderCorbeille();
  else html = renderProtocoles();
  document.getElementById('content').innerHTML = html;
  attachContentHandlers();
}

function renderCalendar(){
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstOfMonth = new Date(year,month,1);
  let startOffset = firstOfMonth.getDay(); // 0=Sun
  startOffset = (startOffset+6)%7; // convert to Mon=0
  const startDate = new Date(year,month,1-startOffset);
  const today = todayIso();

  let html = renderProfLegend();
  html += '<div class="cal-grid">';
  DOW.forEach(d=> html += `<div class="cal-dow">${d}</div>`);

  for(let i=0;i<42;i++){
    const d = new Date(startDate); d.setDate(startDate.getDate()+i);
    const iso = isoDate(d);
    const inMonth = d.getMonth()===month;
    const isWeekend = d.getDay()===0 || d.getDay()===6;
    const ferie = jourFerieLabel(iso);
    const vacances = vacanceInfo(iso);
    const dayOrders = ordersByDate(iso);
    const shown = dayOrders.slice(0,3);
    const extra = dayOrders.length - shown.length;
    html += `
      <div class="cal-cell ${inMonth?'':'other-month'} ${isWeekend?'weekend':''} ${ferie?'ferie':''} ${vacances&&!ferie?'vacances':''} ${iso===today?'today':''} ${isOrderable(iso)?'':'locked'}" data-date="${iso}" title="${ferie?escapeHtml(ferie):(vacances?escapeHtml(vacances.label):'')}">
        ${isOrderable(iso)?`<button type="button" class="cal-add-btn" data-date="${iso}" title="Déposer une commande ce jour">+</button>`:''}
        <div class="cal-daynum">${d.getDate()}${dayOrders.length?`<span class="cal-badge">${dayOrders.length}</span>`:''}</div>
        ${ferie?`<div class="cal-ferie-label">${escapeHtml(ferie)}</div>`:(vacances?`<div class="cal-vacances-label">${escapeHtml(vacances.label.replace('Vacances de la ','').replace('Vacances de ','').replace("Vacances d'",''))}</div>`:'')}
        <div class="cal-tags">
          ${shown.map(o=>{
            const c = getProfColor(o.prof);
            return `<div class="cal-tag ${o.prepared?'prepared':''}" draggable="true" data-order-id="${o.id}" style="border-left-color:${c.border};background:${c.bg};color:${c.text};">${o.prepared?'✓ ':''}${o.horaire?escapeHtml(o.horaire)+' · ':''}${escapeHtml(o.prof)}</div>`;
          }).join('')}
          ${extra>0?`<div class="cal-more">+${extra}</div>`:''}
        </div>
      </div>`;
  }
  html += '</div>';
  return html;
}

function renderAgenda(){
  const profs = Array.from(new Set(orders.map(o=>o.prof))).sort((a,b)=>a.localeCompare(b,'fr'));
  const classes = Array.from(new Set(orders.map(o=>o.classe).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'fr'));
  if(window._agendaProfFilter && window._agendaProfFilter!=='tous' && !profs.includes(window._agendaProfFilter)){
    window._agendaProfFilter = 'tous'; // l'enseignant filtré n'a plus aucune commande : on revient au filtre par défaut
  }
  if(window._agendaClasseFilter && window._agendaClasseFilter!=='toutes' && !classes.includes(window._agendaClasseFilter)){
    window._agendaClasseFilter = 'toutes'; // idem pour la classe
  }
  const profVal = window._agendaProfFilter || 'tous';
  const classeVal = window._agendaClasseFilter || 'toutes';

  let list = orders.filter(o=>{
    if(profVal!=='tous' && o.prof!==profVal) return false;
    if(classeVal!=='toutes' && o.classe!==classeVal) return false;
    return true;
  }).sort((a,b)=>a.date.localeCompare(b.date));

  window._agendaCurrentList = list;

  let filtersHtml = `
    ${renderProfLegend(profs)}
    <div class="agenda-filters">
      <select id="agenda-prof">
        <option value="tous">Tous les enseignants</option>
        ${profs.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}
      </select>
      <select id="agenda-classe">
        <option value="toutes">Toutes les classes</option>
        ${classes.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
      </select>
      <button type="button" class="download-btn" id="download-csv">⬇ Télécharger (${list.length})</button>
    </div>`;

  let body;
  if(list.length===0){
    body = '<div class="empty">Aucune commande ne correspond à ces filtres.</div>';
  }else{
    body = '';
    let currentMonth = null;
    for(const o of list){
      const mk = fmtMonthKey(o.date);
      if(mk!==currentMonth){ body += `<div class="month-heading">${mk}</div>`; currentMonth = mk; }
      body += renderSlip(o);
    }
  }
  return filtersHtml + body;
}

function renderParEnseignant(){
  const profs = Array.from(new Set(orders.map(o=>o.prof))).sort((a,b)=>a.localeCompare(b,'fr'));
  if(window._profViewFilter && window._profViewFilter!=='tous' && !profs.includes(window._profViewFilter)){
    window._profViewFilter = 'tous';
  }
  const selectedProf = window._profViewFilter || 'tous';

  let html = `<div class="agenda-filters">
      <select id="profview-select">
        <option value="tous">Tous les enseignants</option>
        ${profs.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}
      </select>
    </div>`;

  if(profs.length===0){
    return html + '<div class="empty">Aucune commande enregistrée.</div>';
  }

  const filteredProfs = selectedProf==='tous' ? profs : [selectedProf];
  filteredProfs.forEach(p=>{
    const profOrders = orders.filter(o=>o.prof===p).sort((a,b)=>a.date.localeCompare(b.date));
    const c = getProfColor(p);
    html += `<div class="month-heading" style="border-left:4px solid ${c.border};padding-left:8px;">${escapeHtml(p)} — ${profOrders.length} commande${profOrders.length!==1?'s':''}</div>`;
    if(profOrders.length===0){
      html += '<div class="empty">Aucune commande.</div>';
    }else{
      profOrders.forEach(o=> html += renderSlip(o));
    }
  });
  return html;
}

function renderSearchResults(q){
  const query = q.trim().toLowerCase();
  if(!query){
    return '<div class="empty">Tapez au moins un mot pour lancer la recherche (enseignant, classe, salle, article, note…).</div>';
  }
  const matches = orders.filter(o=>{
    const haystack = [
      o.prof, o.classe, o.salle, o.notes, o.protocoleTitre,
      ...(o.items||[]).map(it=>it.name)
    ].filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(query);
  }).sort((a,b)=>a.date.localeCompare(b.date));

  if(matches.length===0){
    return `<div class="empty">Aucun résultat pour « ${escapeHtml(q)} ».</div>`;
  }
  let body = `<div class="prepare-count">${matches.length} résultat${matches.length!==1?'s':''}</div>`;
  let currentMonth = null;
  for(const o of matches){
    const mk = fmtMonthKey(o.date);
    if(mk!==currentMonth){ body += `<div class="month-heading">${mk}</div>`; currentMonth = mk; }
    body += renderSlip(o);
  }
  return body;
}

function renderRecherche(){
  const q = window._searchQuery || '';
  return `
    <div class="agenda-filters">
      <input type="text" id="search-input" placeholder="Rechercher un enseignant, une classe, une salle, un article, une note…" value="${escapeHtml(q)}" style="flex:1;min-width:240px;padding:9px 10px;border:1px solid var(--border);border-radius:4px;font-family:'IBM Plex Sans',sans-serif;font-size:15px;background:var(--card);color:var(--ink);">
    </div>
    <div id="search-results">${renderSearchResults(q)}</div>`;
}

function attachSlipActionHandlers(root){
  root.querySelectorAll('[data-action="delete"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o && confirm('Mettre cette commande à la corbeille ? Vous pourrez la restaurer, ou elle sera supprimée définitivement (et le matériel restitué au stock) après 30 jours.')){
        await softDeleteOrder(o);
      }
    });
  });
  root.querySelectorAll('[data-action="duplicate"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o) openDuplicateModal(o);
    });
  });
  root.querySelectorAll('[data-action="edit-order"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o) openEditOrderModal(o);
    });
  });
  attachPrepareHandlers(root);
}

function weekRangeLabel(mondayIso){
  const start = new Date(mondayIso+'T00:00:00');
  const end = new Date(start); end.setDate(start.getDate()+6);
  return `Semaine du ${fmtDateShort(mondayIso)} au ${fmtDateShort(isoDate(end))} ${end.getFullYear()}`;
}

function renderPrepare(){
  const weekStart = prepareCursor;
  const end = new Date(weekStart+'T00:00:00'); end.setDate(end.getDate()+6);
  const weekEnd = isoDate(end);
  const isCurrentWeek = weekStart === mondayOf(todayIso());

  const list = orders.filter(o=> o.date>=weekStart && o.date<=weekEnd).sort((a,b)=>a.date.localeCompare(b.date));
  window._prepareCurrentList = list;
  const remaining = list.filter(o=>!o.prepared).length;

  let header = `
    <div class="agenda-filters prepare-nav">
      <button type="button" id="prepare-prev-week" title="Semaine précédente">‹</button>
      <div class="prepare-week-label">
        <div>${weekRangeLabel(weekStart)}</div>
        ${!isCurrentWeek ? '<button type="button" id="prepare-today-week" class="link-btn">revenir à cette semaine</button>' : ''}
      </div>
      <button type="button" id="prepare-next-week" title="Semaine suivante">›</button>
      <div class="prepare-count">${remaining} commande${remaining!==1?'s':''} à préparer sur ${list.length} cette semaine</div>
      <button type="button" class="download-btn" id="print-prepare-btn">🖨 Imprimer cette semaine</button>
      <button type="button" class="download-btn" id="pdf-prepare-btn" style="background:var(--teal);border-color:var(--teal);">⬇ PDF</button>
    </div>`;

  let body;
  if(list.length===0){
    body = '<div class="empty">Aucune commande cette semaine-là.</div>';
  }else{
    body = '';
    let currentDate = null;
    for(const o of list){
      if(o.date!==currentDate){ body += `<div class="month-heading">${capitalize(fmtDateLong(o.date))}</div>`; currentDate = o.date; }
      body += renderSlip(o);
    }
  }
  return header + body;
}

function daysUntilPurge(supprimeLe){
  if(!supprimeLe) return TRASH_RETENTION_DAYS;
  const elapsedDays = (Date.now() - supprimeLe) / (24*60*60*1000);
  return Math.max(0, Math.ceil(TRASH_RETENTION_DAYS - elapsedDays));
}

function renderBackupBlock(){
  return `
    <div class="backup-block">
      <div class="backup-block-text">Vous pouvez restaurer des éléments à partir d'un fichier de sauvegarde téléchargé précédemment (bouton 💾 Sauvegarder en haut de page). Seuls les éléments absents des données actuelles seront recréés — rien d'existant ne sera écrasé.</div>
      <button type="button" id="restore-backup-btn" class="download-btn">📤 Restaurer depuis une sauvegarde</button>
      <input type="file" id="restore-backup-input" accept="application/json" style="display:none;">
    </div>`;
}

function renderCorbeille(){

  }

  const ordersSorted = [...ordersTrash].sort((a,b)=>(b.supprimeLe||0)-(a.supprimeLe||0));
  const catSorted = [...catalogueTrash].sort((a,b)=>(b.supprimeLe||0)-(a.supprimeLe||0));
  const protoSorted = [...protocolesTrash].sort((a,b)=>(b.supprimeLe||0)-(a.supprimeLe||0));

  const ordersHtml = ordersSorted.length ? ordersSorted.map(o=>`
    <div class="slip">
      <div class="slip-head">

          <div class="slip-date">${fmtDateLong(o.date)} — ${escapeHtml(o.prof||'')}${o.classe?` · ${escapeHtml(o.classe)}`:''}</div>
          <div class="slip-meta">${(o.items||[]).map(it=>`${escapeHtml(it.nom)} (${it.qty}${it.unite?' '+escapeHtml(it.unite):''})`).join(', ')}</div>
        </div>
      </div>
      <div class="slip-meta">Supprimée le ${fmtDateLong(isoDate(new Date(o.supprimeLe||Date.now())))} — purge définitive dans ${daysUntilPurge(o.supprimeLe)} j</div>
      <div class="slip-actions">
        <button type="button" data-action="restore-order" data-id="${o.id}">restaurer</button>
        <button type="button" data-action="purge-order" data-id="${o.id}">supprimer définitivement</button>
      </div>
    </div>`).join('') : '<div class="empty">Aucune commande dans la corbeille.</div>';

  const catHtml = catSorted.length ? catSorted.map(it=>`
    <div class="slip">
      <div class="slip-head"><div><div class="slip-date">${escapeHtml(it.nom)}</div>
      <div class="slip-meta">${it.quantite!=null?it.quantite:'—'}${it.unite?' '+escapeHtml(it.unite):''}${it.categorie?' · '+escapeHtml(it.categorie):''}</div></div></div>
      <div class="slip-meta">Supprimé le ${fmtDateLong(isoDate(new Date(it.supprimeLe||Date.now())))} — purge définitive dans ${daysUntilPurge(it.supprimeLe)} j</div>
      <div class="slip-actions">
        <button type="button" data-action="restore-cat" data-id="${it.id}">restaurer</button>
        <button type="button" data-action="purge-cat" data-id="${it.id}">supprimer définitivement</button>
      </div>
    </div>`).join('') : '<div class="empty">Aucun article dans la corbeille.</div>';

  const protoHtml = protoSorted.length ? protoSorted.map(p=>`
    <div class="slip">
      <div class="slip-head"><div><div class="slip-date">${escapeHtml(p.titre)}</div>
      ${(p.classes && p.classes.length) ? `<div class="slip-meta">${p.classes.map(escapeHtml).join(' · ')}</div>` : ''}</div></div>
      <div class="slip-meta">Supprimé le ${fmtDateLong(isoDate(new Date(p.supprimeLe||Date.now())))} — purge définitive dans ${daysUntilPurge(p.supprimeLe)} j</div>
      <div class="slip-actions">
        <button type="button" data-action="restore-proto" data-id="${p.id}">restaurer</button>
        <button type="button" data-action="purge-proto" data-id="${p.id}">supprimer définitivement</button>
      </div>
    </div>`).join('') : '<div class="empty">Aucun protocole dans la corbeille.</div>';

  return `
    <div class="cat-wrap">
      <div class="cat-intro" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <span>Les éléments supprimés sont conservés ${TRASH_RETENTION_DAYS} jours avant suppression définitive (et, pour les commandes, restitution automatique du matériel au stock).</span>
        <button type="button" id="empty-trash-btn" class="file-btn" style="white-space:nowrap;">🗑 Vider la corbeille</button>

      ${catHtml}

      ${protoHtml}

function loadCollapsedCatGroups(){
  try{ return new Set(JSON.parse(localStorage.getItem('agenda-tp-cat-collapsed')||'[]')); }catch(e){ return new Set(); }
}
function saveCollapsedCatGroups(set){
  try{ localStorage.setItem('agenda-tp-cat-collapsed', JSON.stringify([...set])); }catch(e){}
}

function renderCatalogue(){
  const categories = getCatalogueCategories();
  if(window._catCategoryFilter && window._catCategoryFilter!=='toutes' && window._catCategoryFilter!=='__sans__' && !categories.includes(window._catCategoryFilter)){
    window._catCategoryFilter = 'toutes'; // la catégorie filtrée n'existe plus (renommée/supprimée) : retour au filtre par défaut
  }
  const catFilter = window._catCategoryFilter || 'toutes';
  const searchTerm = (window._catSearch || '').trim().toLowerCase();
  const lowStockOnly = !!window._catLowStockOnly;
  const sort = window._catSort || { key:'nom', dir:'asc' };
  const selected = window._catSelected || (window._catSelected = new Set());
  const editingId = window._catEditingId || null;

  const items = [...catalogue]
    .filter(it=> catFilter==='toutes' || (it.categorie||'')===catFilter || (catFilter==='__sans__' && !it.categorie))
    .filter(it=> !searchTerm || (it.nom||'').toLowerCase().includes(searchTerm))
    .filter(it=> !lowStockOnly || (it.quantite!=null && it.quantite<LOW_STOCK_THRESHOLD))
    .sort((a,b)=>{
      let cmp;
      if(sort.key==='quantite'){
        const av = a.quantite!=null ? a.quantite : -Infinity, bv = b.quantite!=null ? b.quantite : -Infinity;
        cmp = av - bv;
      }else{
        cmp = (a.nom||'').localeCompare(b.nom||'','fr');
      }
      return sort.dir==='asc' ? cmp : -cmp;
    });
  window._catCurrentList = items;
  // On ne garde en sélection que des articles encore visibles/existants.
  const validIds = new Set(catalogue.map(it=>it.id));
  [...selected].forEach(id=>{ if(!validIds.has(id)) selected.delete(id); });

  const groups = new Map();
  items.forEach(it=>{
    const key = it.categorie || '__sans__';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  });
  const groupKeys = [...groups.keys()].sort((a,b)=>{
    if(a==='__sans__') return 1;
    if(b==='__sans__') return -1;
    return a.localeCompare(b,'fr');
  });

  const rowHtml = it => {
    if(it.id === editingId) return renderCatEditRow(it, categories);
    const isChecked = selected.has(it.id);
    return `
    <div class="cat-row" data-id="${it.id}">
      <label class="cat-check"><input type="checkbox" class="cat-select" data-id="${it.id}" ${isChecked?'checked':''}></label>
      <div class="cat-name">${it.nom ? escapeHtml(it.nom) : '(article sans nom — à corriger ou supprimer)'}</div>
      <div class="cat-qty"><span class="qty-view ${it.quantite!=null && it.quantite<0 ? 'qty-negative' : ''}">${it.quantite!=null && it.quantite!==''?it.quantite:'—'}</span> <span class="cat-unit">${escapeHtml(it.unite||'')}</span></div>
      <div class="cat-actions">
        <button type="button" class="cat-icon-btn" data-action="restock-cat" data-id="${it.id}" title="Ajouter 1 au stock">+1</button>
        <button type="button" class="cat-icon-btn" data-action="destock-cat" data-id="${it.id}" title="Retirer 1 du stock">-1</button>
        <button type="button" class="cat-icon-btn" data-action="edit-cat" data-id="${it.id}" title="Modifier">✏️</button>
        <button type="button" class="cat-icon-btn danger" data-action="delete-cat" data-id="${it.id}" title="Supprimer">🗑️</button>
      </div>
    </div>`;
  };

  const collapsedGroups = window._catCollapsedGroups || (window._catCollapsedGroups = loadCollapsedCatGroups());
  const allCollapsed = groupKeys.length>0 && groupKeys.every(k=>collapsedGroups.has(k));

  const rows = items.length ? groupKeys.map(key=>{
      const isCollapsed = collapsedGroups.has(key);
      const groupItems = groups.get(key);
      return `
      <div class="cat-group-heading${isCollapsed?' collapsed':''}" data-group="${escapeHtml(key)}">
        <span class="cat-group-arrow">▶</span>
        <span>${key==='__sans__' ? 'Sans catégorie' : escapeHtml(key)}</span>
        <span class="cat-group-count">${groupItems.length}</span>
        ${key!=='__sans__' ? `<button type="button" class="cat-group-rename" data-action="rename-cat-group" data-group="${escapeHtml(key)}" title="Renommer cette catégorie">✏️</button>` : ''}
      </div>
      ${isCollapsed ? '' : groupItems.map(rowHtml).join('')}
    `;
    }).join('') : `<div class="empty">${catalogue.length===0 ? 'Le catalogue est vide pour le moment. Ajoutez le premier article ci-dessous.' : 'Aucun article ne correspond à ces filtres.'}</div>`;

  const sortArrow = key => sort.key===key ? `<span class="cat-sort-arrow">${sort.dir==='asc'?'▲':'▼'}</span>` : '';
  const allVisibleIds = items.map(it=>it.id);
  const allVisibleChecked = allVisibleIds.length>0 && allVisibleIds.every(id=>selected.has(id));

  const bulkBar = selected.size>0 ? `
      <div class="cat-bulk-bar">
        <span class="cat-bulk-count">${selected.size} article${selected.size>1?'s':''} sélectionné${selected.size>1?'s':''}</span>
        <select id="cat-bulk-category">
          <option value="__noop__" selected>Changer la catégorie…</option>
          <option value="">Aucune</option>
          ${categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
        </select>
        <button type="button" id="cat-bulk-delete-btn" class="danger">🗑️ Supprimer la sélection</button>
        <button type="button" id="cat-bulk-clear-btn">Annuler la sélection</button>

function parseImportText(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.includes('\t') ? line.split('\t') : line.includes(';') ? line.split(';') : line.split(',');
    const nom = (parts[0]||'').trim();
    let quantite = parts[1]!==undefined ? parts[1].trim().replace(',','.') : '';
    quantite = quantite!=='' && !isNaN(Number(quantite)) ? Number(quantite) : null;
    const unite = (parts[2]||'').trim();
    const categorie = (parts[3]||'').trim();
    return { nom, quantite, unite, categorie };
  }).filter(r=> r.nom && !['nom','article','matériel','materiel'].includes(r.nom.toLowerCase()));
}

function renderImportPreview(rows){
  if(!rows.length) return '<div class="err" style="display:block;">Aucun article valide détecté dans le texte fourni.</div>';
  const existingNames = new Set(catalogue.map(c=>(c.nom||'').toLowerCase()));
  const seenInImport = new Set(); // détecte les doublons internes à la liste importée elle-même
  let nbNew = 0, nbMaj = 0, nbDoublonInterne = 0;
  rows.forEach(r=>{
    const key = r.nom.toLowerCase();
    if(existingNames.has(key) || seenInImport.has(key)){
      nbMaj++;
      if(!existingNames.has(key)) nbDoublonInterne++;
    }else{
      nbNew++;
    }
    seenInImport.add(key);
  });
  return `
    <div class="import-summary">${rows.length} ligne${rows.length>1?'s':''} détectée${rows.length>1?'s':''} — ${nbNew} nouvel${nbNew>1?'les':'le'} article${nbNew>1?'s':''}, ${nbMaj} mise${nbMaj>1?'s':''} à jour${nbDoublonInterne?` (dont ${nbDoublonInterne} doublon${nbDoublonInterne>1?'s':''} dans la liste collée, qui seront fusionnés)`:''}.</div>
    <ul class="import-list">
      ${rows.slice(0,40).map(r=>`<li>${escapeHtml(r.nom)}${r.quantite!=null?' — '+r.quantite:''}${r.unite?' '+escapeHtml(r.unite):''}${r.categorie?' <span class="import-tag">'+escapeHtml(r.categorie)+'</span>':''}${existingNames.has(r.nom.toLowerCase())?' <span class="import-tag">mise à jour</span>':''}</li>`).join('')}
      ${rows.length>40?`<li>… et ${rows.length-40} de plus</li>`:''}
    </ul>
    <div class="cat-import-actions">
      <button type="button" class="submit-btn" id="confirm-import-btn">Confirmer l'import (${rows.length})</button>
      <button type="button" class="add-item-btn" id="cancel-import-btn">Annuler</button>
    </div>
  `;
}

function attachPrepareHandlers(root){
  (root||document).querySelectorAll('[data-action="toggle-prepared"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const id = el.getAttribute('data-id');
      const checked = el.checked;
      const setState = (isPrepared)=>{
        el.closest('.slip').classList.toggle('prepared', isPrepared);
        el.nextSibling.textContent = isPrepared ? '✓ Préparé' : 'Préparé';
      };
      setState(checked);
      el.disabled = true;
      try{
        await ordersCol.doc(id).update({ prepared: checked });
      }catch(err){
        console.error(err);
        el.checked = !checked;
        setState(!checked);
        alert("La mise à jour a échoué. Réessayez.");
      }finally{
        el.disabled = false;
      }
    });
  });
  const prevWeekBtn = document.getElementById('prepare-prev-week');
  const nextWeekBtn = document.getElementById('prepare-next-week');
  const todayWeekBtn = document.getElementById('prepare-today-week');
  if(prevWeekBtn){
    prevWeekBtn.addEventListener('click', ()=>{
      const d = new Date(prepareCursor+'T00:00:00'); d.setDate(d.getDate()-7);
      prepareCursor = isoDate(d); render();
    });
  }
  if(nextWeekBtn){
    nextWeekBtn.addEventListener('click', ()=>{
      const d = new Date(prepareCursor+'T00:00:00'); d.setDate(d.getDate()+7);
      prepareCursor = isoDate(d); render();
    });
  }
  if(todayWeekBtn){
    todayWeekBtn.addEventListener('click', ()=>{
      prepareCursor = mondayOf(todayIso()); render();
    });
  }
}

      if(confirm(`Supprimer définitivement les ${total} élément(s) de la corbeille ? Cette action est irréversible` + (restitution ? ' (le matériel des commandes sera restitué au stock).' : '.'))){

        emptyTrashBtn.disabled = false;
      }
    });

    restoreBackupBtn.addEventListener('click', ()=> restoreBackupInput.click());

      const file = restoreBackupInput.files[0];
      if(file) await restoreFromBackupFile(file);
      restoreBackupInput.value = '';
    });
  }
  document.querySelectorAll('[data-action="purge-proto"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const p = protocolesTrash.find(x=>x.id===el.getAttribute('data-id'));
      if(p && confirm(`Supprimer définitivement le protocole « ${p.titre} » ? Cette action est irréversible.`)){
        try{ await protocolesCol.doc(p.id).delete(); }
        catch(err){ console.error(err); alert("La suppression a échoué : " + (err && err.message ? err.message : err)); }
      }
    });
  });
  document.querySelectorAll('.cal-cell').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      hideOrderTooltip();
      const iso = cell.getAttribute('data-date');
      if(!isOrderable(iso)){
        alert(`Ce jour est à moins de ${MIN_LEAD_DAYS} jours : il est trop tard pour y déposer une nouvelle commande.`);
        return;
      }
      openDayModal(iso, false);
    });
  });
  document.querySelectorAll('.cal-add-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const iso = btn.getAttribute('data-date');
      if(!isOrderable(iso)){
        alert(`Ce jour est à moins de ${MIN_LEAD_DAYS} jours : il est trop tard pour y déposer une nouvelle commande.`);
        return;
      }
      openDayModal(iso, true);
    });
  });
  document.querySelectorAll('.cal-tag[draggable="true"]').forEach(tag=>{
    tag.addEventListener('dragstart', (e)=>{
      e.stopPropagation();
      e.dataTransfer.effectAllowed = 'copyMove';
      e.dataTransfer.setData('text/plain', tag.getAttribute('data-order-id'));
      tag.classList.add('dragging');
      hideOrderTooltip();
    });
    tag.addEventListener('dragend', ()=> tag.classList.remove('dragging'));
    tag.addEventListener('mouseenter', ()=>{
      const o = orders.find(x=>x.id===tag.getAttribute('data-order-id'));
      if(o) showOrderTooltip(o, tag);
    });
    tag.addEventListener('mouseleave', hideOrderTooltip);
    // Clic droit (souris) : menu contextuel immédiat.
    tag.addEventListener('contextmenu', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const o = orders.find(x=>x.id===tag.getAttribute('data-order-id'));
      if(o) showCtxMenu(o, e.clientX, e.clientY);
    });
    // Appui long (tactile) : même menu contextuel, sans ouvrir la modale du jour.
    let longPressTimer = null, longPressMoved = false;
    tag.addEventListener('touchstart', (e)=>{
      longPressMoved = false;
      const touch = e.touches[0];
      const startX = touch.clientX, startY = touch.clientY;
      longPressTimer = setTimeout(()=>{
        if(longPressMoved) return;
        const o = orders.find(x=>x.id===tag.getAttribute('data-order-id'));
        if(o){
          if(navigator.vibrate) navigator.vibrate(15);
          showCtxMenu(o, startX, startY);
          tag.dataset.suppressClick = '1';
        }
      }, 500);
    }, {passive:true});
    tag.addEventListener('touchmove', ()=>{ longPressMoved = true; clearTimeout(longPressTimer); }, {passive:true});
    tag.addEventListener('touchend', ()=> clearTimeout(longPressTimer), {passive:true});
    tag.addEventListener('touchcancel', ()=> clearTimeout(longPressTimer), {passive:true});
    tag.addEventListener('click', (e)=>{
      if(tag.dataset.suppressClick){
        e.stopPropagation();
        e.preventDefault();
        delete tag.dataset.suppressClick;
      }
    });
  });
  document.querySelectorAll('.cal-cell').forEach(cell=>{
    cell.addEventListener('dragover', (e)=>{
      if(!isOrderable(cell.getAttribute('data-date'))) return;
      e.preventDefault();
      const wantsDuplicate = e.ctrlKey || e.metaKey || e.altKey;
      e.dataTransfer.dropEffect = wantsDuplicate ? 'copy' : 'move';
      cell.classList.add('drop-target');
      cell.classList.toggle('drop-copy', wantsDuplicate);
    });
    cell.addEventListener('dragleave', ()=> cell.classList.remove('drop-target','drop-copy'));
    cell.addEventListener('drop', async (e)=>{
      e.preventDefault();
      cell.classList.remove('drop-target','drop-copy');
      const orderId = e.dataTransfer.getData('text/plain');
      const newIso = cell.getAttribute('data-date');
      if(!orderId || !newIso) return;
      const order = orders.find(o=>o.id===orderId);
      if(!order) return;
      const wantsDuplicate = e.ctrlKey || e.metaKey || e.altKey;
      if(!wantsDuplicate && order.date===newIso) return;
      if(!isOrderable(newIso)){
        alert(`Ce jour est à moins de ${MIN_LEAD_DAYS} jours : il est trop tard pour y ${wantsDuplicate?'dupliquer':'déplacer'} une commande.`);
        return;
      }
      if(wantsDuplicate){
        if(!confirm(`Dupliquer la commande de ${order.prof} du ${fmtDateLong(order.date)} vers le ${fmtDateLong(newIso)} ?`)) return;
        await duplicateOrderToDate(order, newIso);
      }else{
        if(!confirm(`Déplacer la commande de ${order.prof} du ${fmtDateLong(order.date)} au ${fmtDateLong(newIso)} ?`)) return;
        await moveOrderToDate(order, newIso);
      }
    });
  });
  const profSel = document.getElementById('agenda-prof');
  if(profSel){
    profSel.value = window._agendaProfFilter || 'tous';
    profSel.addEventListener('change', e=>{ window._agendaProfFilter = e.target.value; render(); });

  const classeSel = document.getElementById('agenda-classe');

    classeSel.value = window._agendaClasseFilter || 'toutes';
    classeSel.addEventListener('change', e=>{ window._agendaClasseFilter = e.target.value; render(); });
  }
  const profViewSel = document.getElementById('profview-select');
  if(profViewSel){
    profViewSel.value = window._profViewFilter || 'tous';
    profViewSel.addEventListener('change', e=>{ window._profViewFilter = e.target.value; render(); });
  }
  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.focus();
    const pos = searchInput.value.length;
    searchInput.setSelectionRange(pos, pos);
    searchInput.addEventListener('input', e=>{
      window._searchQuery = e.target.value;

    });

  const downloadBtn = document.getElementById('download-csv');
  if(downloadBtn){
    downloadBtn.addEventListener('click', ()=> downloadCsv(window._agendaCurrentList || []));
  }
  const printPrepareBtn = document.getElementById('print-prepare-btn');
  if(printPrepareBtn){
    printPrepareBtn.addEventListener('click', ()=> printOrdersGrouped(weekRangeLabel(prepareCursor), window._prepareCurrentList || []));
  }
  const pdfPrepareBtn = document.getElementById('pdf-prepare-btn');
  if(pdfPrepareBtn){
    pdfPrepareBtn.addEventListener('click', ()=> exportOrdersPdf(weekRangeLabel(prepareCursor), window._prepareCurrentList || [], `commandes-tp-semaine-${todayIso()}.pdf`));
  }
  document.querySelectorAll('[data-action="delete"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o && confirm('Mettre cette commande à la corbeille ? Vous pourrez la restaurer, ou elle sera supprimée définitivement (et le matériel restitué au stock) après 30 jours.')){
        await softDeleteOrder(o);
      }
    });
  });
  document.querySelectorAll('[data-action="duplicate"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o) openDuplicateModal(o);
    });
  });
  document.querySelectorAll('[data-action="edit-order"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o) openEditOrderModal(o);
    });
  });

  const catForm = document.getElementById('cat-form');
  if(catForm){
    catForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const errEl = document.getElementById('cat-err');
      errEl.style.display = 'none';
      const nom = document.getElementById('c-nom').value.trim();
      const qty = document.getElementById('c-qty').value;
      const unite = document.getElementById('c-unit').value;
      const catSel = document.getElementById('c-category').value;
      const categorie = catSel==='__autre__' ? document.getElementById('c-category-autre').value.trim() : catSel;
      if(!nom){
        errEl.textContent = 'Indiquez le nom du matériel.';
        errEl.style.display = 'block';
        return;
      }
      const doublon = catalogue.find(it=>(it.nom||'').toLowerCase()===nom.toLowerCase());
      if(doublon){
        errEl.textContent = 'Cet article existe déjà dans le catalogue. Utilisez « modifier » pour ajuster sa quantité.';
        errEl.style.display = 'block';
        return;
      }
      try{
        await catalogueCol.add({ nom, quantite: qty!==''?Number(qty):null, unite, categorie: categorie||null, updatedAt: Date.now() });
        catForm.reset();
      }catch(err){
        errEl.textContent = "L'ajout a échoué. Vérifiez la connexion et réessayez.";
        errEl.style.display = 'block';
      }

async function importCatalogueRows(rows){
  const existingByName = new Map(catalogue.map(c=>[(c.nom||'').toLowerCase(), c]));
  const chunks = [];
  for(let i=0;i<rows.length;i+=400) chunks.push(rows.slice(i,i+400)); // limite de sécurité par lot Firestore (500 max)

  for(const chunk of chunks){
    const batch = db.batch();
    chunk.forEach(r=>{
      const key = r.nom.toLowerCase();
      const existing = existingByName.get(key);
      if(existing){
        const merged = {
          id: existing.id,
          nom: existing.nom,
          quantite: r.quantite!=null ? r.quantite : existing.quantite,
          unite: r.unite || existing.unite || '',
          categorie: r.categorie || existing.categorie || null
        };
        batch.update(catalogueCol.doc(existing.id), {
          quantite: merged.quantite, unite: merged.unite, categorie: merged.categorie, updatedAt: Date.now()
        });
        existingByName.set(key, merged); // évite de recréer un doublon si le même nom réapparaît plus loin dans l'import
      }else{
        const ref = catalogueCol.doc();
        const created = { id: ref.id, nom: r.nom, quantite: r.quantite, unite: r.unite||'', categorie: r.categorie||null };
        batch.set(ref, { nom: created.nom, quantite: created.quantite, unite: created.unite, categorie: created.categorie, updatedAt: Date.now() });
        existingByName.set(key, created); // idem pour un nouvel article dupliqué plusieurs fois dans le même import
      }
    });
    await batch.commit();
  }
}

      if(name) items.push({name, qty: qty?Number(qty):1, unit});
    });

    if(items.length===0){
      errEl.textContent = 'Ajoutez au moins un élément de matériel.';
      errEl.style.display = 'block';
      return;
    }

    try{
      await createOrderAndDeductStock({
        prof, date: iso, classe, horaire, salle, items, notes,
        protocoleTitre: protocole ? protocole.titre : null,
        protocoleLien: protocole ? protocole.lien : null
      });
      openDayModal(iso, true);
    }catch(err){
      errEl.textContent = "L'enregistrement a échoué. Vérifiez la connexion et réessayez.";
      errEl.style.display = 'block';
    }
  });
}

function closeMatImportPanel(prefix){
  const panel = document.getElementById(`${prefix}-mat-import-panel`);
  if(panel){ panel.style.display = 'none'; panel.innerHTML = ''; }
}

function wireMatImportPanel(containerId, prefix){
  const textarea = document.getElementById(`${prefix}-mat-import-text`);
  const fileInput = document.getElementById(`${prefix}-mat-import-file`);
  if(fileInput){
    fileInput.addEventListener('change', ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ textarea.value = reader.result; };
      reader.readAsText(file, 'UTF-8');
    });
  }
  const analyseBtn = document.getElementById(`${prefix}-mat-import-analyse`);
  if(analyseBtn){
    analyseBtn.addEventListener('click', ()=>{
      const rows = parseImportText(textarea.value);
      const previewEl = document.getElementById(`${prefix}-mat-import-preview`);
      previewEl.innerHTML = matImportPreviewHtml(prefix, rows);
      const confirmBtn = document.getElementById(`${prefix}-mat-import-confirm`);
      if(confirmBtn){
        confirmBtn.addEventListener('click', ()=>{
          rows.forEach(r=> addModalItemRow(containerId, { name: r.nom, qty: r.quantite, unit: r.unite||'' }));
          closeMatImportPanel(prefix);
        });
      }
      const cancel2 = document.getElementById(`${prefix}-mat-import-cancel2`);
      if(cancel2) cancel2.addEventListener('click', ()=> closeMatImportPanel(prefix));
    });
  }
  const cancelBtn = document.getElementById(`${prefix}-mat-import-cancel`);
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> closeMatImportPanel(prefix));
}

function setupMatImportUI(containerId, prefix){
  const toggleBtn = document.getElementById(`${prefix}-mat-import-btn`);
  const panel = document.getElementById(`${prefix}-mat-import-panel`);
  if(!toggleBtn || !panel) return;
  toggleBtn.addEventListener('click', ()=>{
    const isOpen = panel.style.display !== 'none';
    if(isOpen){
      closeMatImportPanel(prefix);
      return;
    }
    panel.style.display = 'block';
    panel.innerHTML = matImportPanelInitialHtml(prefix);
    wireMatImportPanel(containerId, prefix);
  });
}

  const container = document.getElementById(containerId);

        <option value="">Toutes catégories</option>
        ${getCatalogueCategories().map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
      </select>

function populateRowDatalist(datalistEl, category){
  if(!datalistEl) return;
  const items = catalogue.filter(it=> it.nom && (!category || (it.categorie||'')===category));
  datalistEl.innerHTML = items
    .slice()
    .sort((a,b)=>a.nom.localeCompare(b.nom,'fr'))
    .map(it=>`<option value="${escapeHtml(it.nom)}">${it.quantite!=null?it.quantite+' '+escapeHtml(it.unite||'')+' en stock':''}</option>`)
    .join('');
}

function updateProtocoleOptions(classeSelectionnee, selectId, presetVal){
  selectId = selectId || 'f-protocole';
  const sel = document.getElementById(selectId);
  if(!sel) return;
  const currentVal = presetVal!==undefined ? presetVal : sel.value;
  const pertinents = classeSelectionnee && classeSelectionnee!=='__autre__'
    ? protocoles.filter(p=> (p.classes||[]).includes(classeSelectionnee))
    : protocoles;
  const autres = classeSelectionnee && classeSelectionnee!=='__autre__'
    ? protocoles.filter(p=> !(p.classes||[]).includes(classeSelectionnee))
    : [];
  sel.innerHTML = `
    <option value="">Aucun</option>
    ${pertinents.map(p=>`<option value="${p.id}">${escapeHtml(p.titre)}</option>`).join('')}
    ${autres.length ? `<optgroup label="Autres classes">${autres.map(p=>`<option value="${p.id}">${escapeHtml(p.titre)}</option>`).join('')}</optgroup>` : ''}
  `;
  if([...sel.options].some(o=>o.value===currentVal)) sel.value = currentVal;
}

function bindQuickAddProto(prefix, classeFieldId, protocoleSelectId){
  const openBtn = document.getElementById(prefix+'-add-proto-btn');
  const panel = document.getElementById(prefix+'-add-proto-panel');
  if(!openBtn || !panel) return;
  openBtn.addEventListener('click', ()=>{
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  const cancelBtn = document.getElementById(prefix+'-proto-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ panel.style.display = 'none'; });
  const confirmBtn = document.getElementById(prefix+'-proto-confirm');
  if(confirmBtn){
    confirmBtn.addEventListener('click', async ()=>{
      const errEl = document.getElementById(prefix+'-proto-err');
      errEl.style.display = 'none';
      const titre = document.getElementById(prefix+'-proto-titre').value.trim();
      const lien = document.getElementById(prefix+'-proto-lien').value.trim();
      if(!titre || !lien){
        errEl.textContent = 'Indiquez au moins un titre et un lien vers le document.';
        errEl.style.display = 'block';
        return;
      }
      if(!/^https?:\/\//i.test(lien)){
        errEl.textContent = 'Le lien doit commencer par http:// ou https://';
        errEl.style.display = 'block';
        return;
      }
      const classeEl = document.getElementById(classeFieldId);
      const classeSel = classeEl ? classeEl.value : '';
