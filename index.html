      const classe = classeSel==='__autre__' ? (classeAutreEl?classeAutreEl.value.trim():'') : classeSel;
      confirmBtn.disabled = true;
      try{
        const ref = await protocolesCol.add({ titre, lien, classes: classe?[classe]:[], notes:'', createdAt: Date.now() });
        updateProtocoleOptions(classeSel, protocoleSelectId, ref.id);
        panel.style.display = 'none';

        document.getElementById(prefix+'-proto-lien').value = '';

        errEl.textContent = "L'ajout a échoué. Vérifiez la connexion et réessayez.";
        errEl.style.display = 'block';
      }
      confirmBtn.disabled = false;
    });
  }
}

function printOrderRowHtml(o){
  const classeSalleParts = [];
  if(o.classe) classeSalleParts.push(escapeHtml(o.classe));
  if(o.salle) classeSalleParts.push('Salle '+escapeHtml(o.salle));
  const classeSalle = classeSalleParts.join(' — ');
  const horaire = o.horaire ? `<span class="horaire">${escapeHtml(o.horaire)}</span>` : '';
  const materielParts = [];
  if(o.items && o.items.length){
    materielParts.push(`<ul>${o.items.map(it=>`<li>${escapeHtml(it.name)} — ${it.qty} ${escapeHtml(it.unit)}</li>`).join('')}</ul>`);
  }
  if(o.protocoleTitre) materielParts.push(`<div class="print-protocole">Protocole : ${escapeHtml(o.protocoleTitre)}</div>`);
  if(o.notes) materielParts.push(`<div class="print-notes">${o.notes}</div>`);
  const materiel = materielParts.join('') || '&nbsp;';
  return `
    <tr>
      <td class="col-prof">${escapeHtml(o.prof||'')}</td>
      <td class="col-classe">${classeSalle}${horaire}</td>
      <td class="col-materiel">${materiel}</td>

function printFooterHtml(){

function printOrdersGrouped(title, list){
  const area = document.getElementById('print-area');
  let html = `<h1>${escapeHtml(title)}</h1>`;
  if(!list || list.length===0){
    html += `<p>Aucune commande.</p>`;
  }else{
    let currentDate = null;
    let blockOpen = false;
    list.forEach(o=>{
      if(o.date!==currentDate){
        if(blockOpen) html += `</tbody></table></div>`;
        html += `<div class="print-day-block">`;
        html += `<h3 class="print-day-heading">${capitalize(fmtDateLong(o.date))}</h3>`;
        html += `<table class="print-table">${PRINT_COLGROUP}<thead><tr><th>Enseignant</th><th>Classe et salle</th><th>Matériel</th></tr></thead><tbody>`;
        blockOpen = true;
        currentDate = o.date;
      }
      html += printOrderRowHtml(o);
    });
    if(blockOpen) html += `</tbody></table></div>`;
  }
  html += printFooterHtml();
  area.innerHTML = html;
  window.print();
}

function printDay(iso){
  printOrdersGrouped(capitalize(fmtDateLong(iso)), ordersByDate(iso));
}

function pdfDay(iso){
  exportOrdersPdf(capitalize(fmtDateLong(iso)), ordersByDate(iso), `commandes-tp-${iso}.pdf`);
}

function mondayOf(iso){
  const d = new Date(iso+'T00:00:00');
  const offset = (d.getDay()+6)%7; // Mon=0
  d.setDate(d.getDate()-offset);
  return isoDate(d);
}

function printWeek(mondayIso){
  const start = new Date(mondayIso+'T00:00:00');
  const end = new Date(start); end.setDate(start.getDate()+6);
  const endIso = isoDate(end);
  const weekOrders = orders.filter(o=> o.date>=mondayIso && o.date<=endIso).sort((a,b)=>a.date.localeCompare(b.date));
  printOrdersGrouped(`Semaine du ${fmtDateShort(mondayIso)} au ${fmtDateShort(endIso)}`, weekOrders);
}

function pdfWeek(mondayIso){
  const start = new Date(mondayIso+'T00:00:00');
  const end = new Date(start); end.setDate(start.getDate()+6);
  const endIso = isoDate(end);
  const weekOrders = orders.filter(o=> o.date>=mondayIso && o.date<=endIso).sort((a,b)=>a.date.localeCompare(b.date));
  exportOrdersPdf(`Semaine du ${fmtDateShort(mondayIso)} au ${fmtDateShort(endIso)}`, weekOrders, `commandes-tp-semaine-${mondayIso}.pdf`);
}

function addYears(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setFullYear(d.getFullYear()+n);
  return isoDate(d);
}
function addOneYear(iso){ return addYears(iso, 1); }

function openDuplicateModal(order){
  dayModalState = null;
  const root = document.getElementById('modal-root');
  const currentYearIso = addYears(order.date, new Date().getFullYear() - new Date(order.date+'T00:00:00').getFullYear());
  const nextYearIso = addOneYear(order.date);
  // Si "cette année" tombe avant le délai minimum (ex. TP déjà passé cette année), on part de la date la plus proche autorisée.
  const currentYearSuggestion = isOrderable(currentYearIso) ? currentYearIso : minOrderableIso();
  const suggested = currentYearSuggestion;
  root.innerHTML = `
    <div class="overlay" id="dup-overlay">
      <div class="modal">

        <div class="field">
          <label for="dup-date">Nouvelle date</label>

          </div>
        </div>
        <div id="dup-err" class="err" style="display:none;"></div>
        <button type="button" class="submit-btn" id="dup-confirm">Dupliquer vers cette date</button>
      </div>
    </div>`;

  document.getElementById('dup-close').addEventListener('click', closeModal);
  document.getElementById('dup-overlay').addEventListener('click', e=>{ if(e.target.id==='dup-overlay') closeModal(); });
  document.getElementById('dup-quick-current').addEventListener('click', ()=>{
    document.getElementById('dup-date').value = isOrderable(currentYearIso) ? currentYearIso : minOrderableIso();
  });
  document.getElementById('dup-quick-next').addEventListener('click', ()=>{
    document.getElementById('dup-date').value = nextYearIso;
  });
  document.getElementById('dup-confirm').addEventListener('click', async ()=>{
    const errEl = document.getElementById('dup-err');
    const newDate = document.getElementById('dup-date').value;
    if(!newDate){
      errEl.textContent = 'Choisissez une date.';
      errEl.style.display = 'block';
      return;
    }

      errEl.textContent = `Ce jour est à moins de ${MIN_LEAD_DAYS} jours : choisissez une date plus éloignée.`;

        protocoleTitre: order.protocoleTitre||null, protocoleLien: order.protocoleLien||null
      });

  });
}

function csvEscape(v){
  const s = String(v==null?'':v);
  if(/["\r\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

async function restoreMissingDocs(collectionRef, existingIds, backupDocs){
  const missing = (backupDocs||[]).filter(d=> d && d.id && !existingIds.has(d.id));
  if(!missing.length) return 0;
  const chunks = [];
  for(let i=0;i<missing.length;i+=400) chunks.push(missing.slice(i,i+400)); // limite de sécurité par lot Firestore (500 max)
  for(const chunk of chunks){
    const batch = db.batch();
    chunk.forEach(d=>{
      const { id, ...data } = d;
      batch.set(collectionRef.doc(id), data);
    });
    await batch.commit();
  }
  return missing.length;
}

async function restoreFromBackupFile(file){
  let backup;
  try{
    const text = await file.text();
    backup = JSON.parse(text);
  }catch(err){
    alert("Ce fichier n'est pas une sauvegarde JSON valide.");
    return;
  }
  if(!backup || (!Array.isArray(backup.commandes) && !Array.isArray(backup.catalogue) && !Array.isArray(backup.protocoles))){
    alert("Ce fichier ne ressemble pas à une sauvegarde de l'agenda (structure inattendue).");
    return;
  }

  const existingOrderIds = new Set([...orders, ...ordersTrash].map(o=>o.id));
  const existingCatIds = new Set([...catalogue, ...catalogueTrash].map(c=>c.id));
  const existingProtoIds = new Set([...protocoles, ...protocolesTrash].map(p=>p.id));

  const missingOrders = (backup.commandes||[]).filter(d=>d && d.id && !existingOrderIds.has(d.id));
  const missingCat = (backup.catalogue||[]).filter(d=>d && d.id && !existingCatIds.has(d.id));
  const missingProto = (backup.protocoles||[]).filter(d=>d && d.id && !existingProtoIds.has(d.id));
  const total = missingOrders.length + missingCat.length + missingProto.length;

  if(total===0){
    alert("Rien à restaurer : toutes les données de cette sauvegarde sont déjà présentes.");
    return;
  }

  const summary = [
    missingOrders.length ? `${missingOrders.length} commande${missingOrders.length>1?'s':''}` : null,
    missingCat.length ? `${missingCat.length} article${missingCat.length>1?'s':''} du catalogue` : null,
    missingProto.length ? `${missingProto.length} protocole${missingProto.length>1?'s':''}` : null
  ].filter(Boolean).join(', ');

  if(!confirm(`Restaurer ${summary} absent(s) des données actuelles ? Rien d'existant ne sera modifié ni écrasé.`)){
    return;
  }

  try{
    await restoreMissingDocs(ordersCol, existingOrderIds, missingOrders);
    await restoreMissingDocs(catalogueCol, existingCatIds, missingCat);
    await restoreMissingDocs(protocolesCol, existingProtoIds, missingProto);
    alert(`Restauration terminée : ${summary}.`);
  }catch(err){
    console.error(err);
    alert("La restauration a échoué en cours de route. Vérifiez les données et réessayez si besoin — ce qui a déjà été restauré reste en place.");
  }
}

function downloadFullBackup(){
  const backup = {
    exporteLe: new Date().toISOString(),
    commandes: [...orders, ...ordersTrash],
    catalogue: [...catalogue, ...catalogueTrash],
    protocoles: [...protocoles, ...protocolesTrash]
  };
  const jsonContent = JSON.stringify(backup, null, 2);
  const blob = new Blob([jsonContent], {type:'application/json;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `sauvegarde-agenda-tp-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadCsv(list){
  if(!list || list.length===0){
    alert("Aucune commande à télécharger avec ces filtres.");
    return;
  }
  const headers = ['Date','Horaire','Salle','Enseignant','Classe','Matériel','Quantité','Unité','Remarques'];
  const rows = [headers];

  list.forEach(o=>{
    const base = [o.date, o.horaire||'', o.salle||'', o.prof||'', o.classe||''];
    const notesPlain = o.notes ? richTextToPlain(o.notes) : '';
    if(o.items && o.items.length){
      o.items.forEach(it=>{
        rows.push([...base, it.name, it.qty, it.unit, notesPlain]);
      });
    }else{
      rows.push([...base, '', '', '', notesPlain]);
    }
  });

  const csvContent = rows.map(r=>r.map(csvEscape).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `commandes-tp-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadCatalogueCsv(list){
  if(!list || list.length===0){
    alert("Aucun article à télécharger avec ces filtres.");
    return;
  }
  const headers = ['Article','Quantité','Unité','Catégorie'];
  const rows = [headers];
  list.forEach(it=>{
    rows.push([it.nom||'', it.quantite!=null?it.quantite:'', it.unite||'', it.categorie||'']);
  });
  const csvContent = rows.map(r=>r.map(csvEscape).join(';')).join('\n');

/* ---------- Raccourcis clavier (modales) ---------- */
document.addEventListener('keydown', (e)=>{
  const modalRoot = document.getElementById('modal-root');
  if(!modalRoot || !modalRoot.firstElementChild) return; // aucune modale ouverte

  if(e.key === 'Escape'){
    closeModal();
    return;
  }

  if((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && dayModalState){
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    const isEditingField = ['INPUT','SELECT','TEXTAREA'].includes(activeTag)
      || (document.activeElement && document.activeElement.isContentEditable);
    if(isEditingField) return; // laisser les flèches fonctionner normalement dans les champs
    e.preventDefault();
    const d = new Date(dayModalState.iso + 'T00:00:00');
    d.setDate(d.getDate() + (e.key === 'ArrowRight' ? 1 : -1));
    openDayModal(isoDate(d), dayModalState.showForm);
  }
});

function updateThemeButtons(){

  const btn2 = document.getElementById('theme-toggle-btn-login');
  if(btn1) btn1.textContent = isDark ? '☀️' : '🌙';

function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('agenda-tp-theme', 'light'); }catch(e){}
  }else{
    document.documentElement.setAttribute('data-theme', 'dark');
    try{ localStorage.setItem('agenda-tp-theme', 'dark'); }catch(e){}
  }
  updateThemeButtons();
}
