<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda des commandes TP — SVT/STL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFE9; --paper-line:#D6DACC; --ink:#1E2B24; --ink-soft:#52604F; --ink-faint:#8A9184;
    --card:#F7F8F3; --teal:#2F6B5E; --teal-dark:#1F4A40; --teal-pale:#DCEAE5;
    --amber:#B9791E; --amber-pale:#F3E4C8; --rust:#A6452F; --rust-pale:#F1DCD3; --border:#C7CDBB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 100% 28px, 28px 100%;
    background-position: 0 0, 0 0;
    background-attachment: fixed;
  }
  body::before{content:none;}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px;position:relative;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:30px;flex-wrap:wrap;gap:12px;
    position:relative;
  }
  header.top::after{
    content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--ink);opacity:0.35;
  }
  header.top .brand{display:flex;align-items:center;gap:12px;}
  header.top .brand svg{flex:none;color:var(--teal-dark);}
  header.top h1{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:21px;margin:0;letter-spacing:-0.01em;}
  header.top .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .conn-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .conn-status.ok{color:var(--teal-dark);}
  .conn-status.err{color:var(--rust);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    font-family:'IBM Plex Mono',monospace;font-size:14px;background:var(--card);
    border:1px solid var(--border);padding:6px 12px;cursor:pointer;color:var(--ink);transition:border-color .12s ease, background .12s ease;
  }
  .month-nav button:hover{border-color:var(--teal);background:var(--teal-pale);}
  .month-title{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;min-width:180px;text-align:center;text-transform:capitalize;}
  .view-toggle{display:flex;border:1px solid var(--border);}
  .view-toggle button{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--card);
    border:none;padding:7px 14px;cursor:pointer;color:var(--ink-soft);
  }
  .view-toggle button.active{background:var(--teal-dark);color:#fff;}

  /* Calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--border);border-top:1px solid var(--border);}
  .cal-dow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--ink-soft);padding:6px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    background:var(--card);
  }
  .cal-cell{
    min-height:96px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:6px 6px 8px;background:#fff;cursor:pointer;position:relative;transition:background .12s ease;
  }
  .cal-cell:hover{background:var(--teal-pale);}
  .cal-cell.other-month{background:var(--paper);color:var(--ink-faint);}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--teal);}
  .cal-cell.today .cal-daynum{color:var(--teal-dark);}
  .cal-cell.locked{
    background:repeating-linear-gradient(135deg, var(--paper) 0px, var(--paper) 6px, #E4E7DC 6px, #E4E7DC 7px);
  }
  .cal-cell.locked:hover{background:repeating-linear-gradient(135deg, var(--teal-pale) 0px, var(--teal-pale) 6px, #CFE2DB 6px, #CFE2DB 7px);}
  .cal-cell.locked .cal-daynum{color:var(--ink-faint);}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;}
  .cal-tags{margin-top:4px;display:flex;flex-direction:column;gap:2px;}
  .cal-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--teal);
    background:var(--teal-pale);color:var(--teal-dark);
  }
  .cal-more{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:2px;}

  @media (max-width:700px){
    .cal-cell{min-height:64px;padding:4px;}
    .cal-tag{font-size:9px;}
  }

  /* List / agenda view */
  .agenda-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .agenda-filters select{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 8px;border:1px solid var(--border);background:var(--card);}
  .download-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 12px;
    border:1px solid var(--teal-dark);background:var(--teal-dark);color:#fff;cursor:pointer;margin-left:auto;
  }
  .download-btn:hover{background:var(--teal);}
  .month-heading{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.06em;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .month-heading:first-child{margin-top:0;}
  .slip{position:relative;background:var(--card);border:1px solid var(--border);margin-bottom:14px;padding:14px 16px 12px;box-shadow:0 1px 2px rgba(30,43,36,0.06), 0 5px 12px rgba(30,43,36,0.05);}
  .slip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
  .slip-date{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
  .slip-meta{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .slip-meta b{color:var(--ink);font-weight:500;}
  .items-list{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--paper-line);}
  .items-list li{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;border-bottom:1px dotted var(--paper-line);}
  .items-list li .qty{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12.5px;margin-left:10px;white-space:nowrap;}
  .notes{margin-top:8px;font-size:13px;color:var(--ink-soft);font-style:italic;}
  .slip-actions{margin-top:10px;display:flex;gap:14px;}
  .slip-actions button{background:none;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);padding:0;}
  .slip-actions button:hover{color:var(--rust);}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(30,43,36,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadeIn .15s ease;}
  .modal{background:#fff;border:1px solid var(--border);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px 24px;box-shadow:0 12px 32px rgba(30,43,36,0.18);animation:riseIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .modal h2{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;margin:0 0 4px;text-transform:capitalize;}
  .modal .modal-close{position:absolute;}
  .modal-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;margin-bottom:14px;}
  .modal-top-actions{display:flex;align-items:center;gap:12px;}
  .print-day-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--card);
    border:1px solid var(--border);padding:6px 10px;cursor:pointer;color:var(--ink-soft);white-space:nowrap;
  }
  .print-day-btn:hover{border-color:var(--teal);background:var(--teal-pale);color:var(--teal-dark);}
  .close-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-faint);line-height:1;}
  .close-btn:hover{color:var(--rust);}
  .modal-section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin:18px 0 8px;}
  .modal-section-label:first-of-type{margin-top:0;}

  label{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 4px;font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  input[type=text],input[type=number],select,textarea{
    width:100%;border:1px solid var(--border);background:#fff;padding:8px 9px;font-size:14px;
    font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);}
  textarea{resize:vertical;min-height:48px;}
  .item-row{display:grid;grid-template-columns:1fr 58px 78px 24px;gap:6px;margin-bottom:6px;align-items:center;}
  .item-row input{padding:7px 8px;font-size:13px;}
  .item-row button{background:none;border:none;color:var(--rust);cursor:pointer;font-size:15px;padding:4px;}
  .add-item-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal-dark);background:none;
    border:1px dashed var(--border);padding:6px 10px;cursor:pointer;width:100%;margin-top:2px;
  }
  .add-item-btn:hover{border-color:var(--teal);}
  .submit-btn{
    width:100%;margin-top:12px;background:var(--teal-dark);color:#fff;border:none;padding:11px;
    font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:500;cursor:pointer;
  }
  .submit-btn:hover{background:var(--teal);}
  .err{color:var(--rust);font-size:12px;margin:-6px 0 8px;font-family:'IBM Plex Mono',monospace;}
  .loading{text-align:center;padding:40px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* Catalogue */
  .cat-intro{font-size:13.5px;color:var(--ink-soft);max-width:640px;margin-bottom:18px;line-height:1.5;}
  .cat-list{border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px rgba(30,43,36,0.06), 0 5px 12px rgba(30,43,36,0.05);}
  .cat-row{
    display:grid;grid-template-columns:1fr 140px 150px;gap:10px;align-items:center;
    padding:10px 14px;border-bottom:1px solid var(--paper-line);
  }
  .cat-row:last-child{border-bottom:none;}
  .cat-row.cat-head{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--ink-soft);background:transparent;border-bottom:1px solid var(--border);padding:8px 14px;
  }
  .cat-name{font-size:14px;}
  .cat-qty{font-family:'IBM Plex Mono',monospace;font-size:13.5px;}
  .qty-negative{color:var(--rust);font-weight:600;}
  .cat-unit{color:var(--ink-soft);font-size:12px;}
  .cat-actions{display:flex;gap:12px;justify-content:flex-end;}
  .cat-actions button{background:none;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);padding:0;}
  .cat-actions button:hover{color:var(--teal-dark);}
  .cat-actions button[data-action="delete-cat"]:hover{color:var(--rust);}
  .cat-add{margin-top:26px;max-width:640px;}
  .field-row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;}
  .cat-import{margin-top:24px;max-width:640px;padding:14px 16px;background:var(--card);border:1px solid var(--border);}
  .cat-import-help{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;}
  .cat-import-help code{font-family:'IBM Plex Mono',monospace;background:var(--paper);padding:1px 4px;}
  .cat-import textarea{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .cat-import-actions{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .file-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    border:1px solid var(--border);padding:6px 10px;cursor:pointer;background:#fff;
  }
  .file-btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  #import-preview{margin-top:12px;}
  .import-summary{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
  .import-list{list-style:none;margin:0 0 10px;padding:0;max-height:220px;overflow-y:auto;border-top:1px solid var(--paper-line);}
  .import-list li{padding:5px 0;font-size:13px;border-bottom:1px dotted var(--paper-line);}
  .import-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);border:1px solid var(--amber);padding:1px 5px;margin-left:6px;}
  #cancel-import-btn{width:auto;flex:none;}
  #confirm-import-btn{width:auto;flex:none;margin-top:0;}
  @media (max-width:640px){
    .cat-row{grid-template-columns:1fr 90px;}
    .cat-row .cat-actions{grid-column:1 / -1;justify-content:flex-start;}
    .field-row-3{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.5 4H17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M13.2 4V11.8L6.8 22.6C6.1 23.8 6.97 25.3 8.36 25.3H21.64C23.03 25.3 23.9 23.8 23.2 22.6L16.8 11.8V4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9.8 18.6H20.2" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="17.3" cy="21.4" r="1" fill="currentColor"/>
        <circle cx="13.8" cy="22.6" r="0.7" fill="currentColor"/>
      </svg>
      <div>
        <h1>Agenda des commandes — TP SVT/STL</h1>
        <div class="sub">Cliquez sur un jour pour déposer une commande de matériel</div>
      </div>
    </div>
    <div class="conn-status" id="conn-status">Connexion à Firebase…</div>
  </header>

  <div class="toolbar">
    <div class="month-nav">
      <button id="prev-month">‹</button>
      <div class="month-title" id="month-title"></div>
      <button id="next-month">›</button>
      <button id="today-btn">Aujourd'hui</button>
    </div>
    <div class="view-toggle">
      <button id="view-cal" class="active">Calendrier</button>
      <button id="view-agenda">Vue d'ensemble</button>
      <button id="view-catalogue">Catalogue</button>
    </div>
  </div>

  <div id="content"><div class="loading">Chargement…</div></div>
</div>

<div id="modal-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* =========================================================================
   1) CONFIGURATION FIREBASE — À REMPLIR
   Remplacez les valeurs ci-dessous par celles de votre projet Firebase
   (Console Firebase > Paramètres du projet > Vos applications > SDK config).
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBRWvbqlOgNPKXEXM4leK9ysRYp-TQ30TI",
  authDomain: "commandes-tp.firebaseapp.com",
  projectId: "commandes-tp",
  storageBucket: "commandes-tp.firebasestorage.app",
  messagingSenderId: "85014859128",
  appId: "1:85014859128:web:7f7b4c137224ba015f4c8d"
};
/* ========================================================================= */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ordersCol = db.collection('commandes');
const catalogueCol = db.collection('catalogue');

let orders = [];
let catalogue = [];
let currentView = 'cal';
let importTextValue = '';
let importPreviewRows = null;
let cursor = new Date(); cursor.setDate(1);
let unsubscribe = null;

const UNITS = ['unité','pièce','boîte','flacon','paquet','g','kg','mL','L','tube','plaque','sachet'];
const CLASSES = ['SVT seconde','SVT première','SVT terminale','Biozone','Enseignement scientifique','BPH première','BPH terminale','Biotech 1STL','Biotech TSTL','Bio-bio 1STL','Biotech seconde'];
const PROFS = ['Anne-Sophie','Catherine','Fred Lanot','Fred Lincker','Julien','Marie','Marina'];
const SALLES = ['A128','A130','A132','A134','A138','A140'];
const DOW = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

const MIN_LEAD_DAYS = 2; // délai minimum, en jours, entre le dépôt d'une commande et la date du TP

function minOrderableIso(){
  const d = new Date();
  d.setDate(d.getDate() + MIN_LEAD_DAYS);
  return isoDate(d);
}
function isOrderable(iso){
  return iso >= minOrderableIso();
}

function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayIso(){ return isoDate(new Date()); }

function connectRealtime(){
  const statusEl = document.getElementById('conn-status');
  if(unsubscribe) unsubscribe();
  unsubscribe = ordersCol.onSnapshot(
    snap=>{
      orders = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      statusEl.textContent = 'Connecté — mise à jour en temps réel';
      statusEl.className = 'conn-status ok';
      render();
    },
    err=>{
      console.error(err);
      statusEl.textContent = 'Connexion Firebase impossible — vérifiez firebaseConfig et les règles Firestore';
      statusEl.className = 'conn-status err';
      document.getElementById('content').innerHTML = '<div class="empty">Impossible de charger les commandes.<br>Vérifiez la configuration Firebase dans index.html.</div>';
    }
  );
  catalogueCol.orderBy('nom').onSnapshot(
    snap=>{
      catalogue = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      if(currentView==='catalogue') render();
      updateMaterielDatalist();
    },
    err=>{ console.error('Erreur catalogue:', err); }
  );
}

function fmtMonthTitle(d){
  return d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
}
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function fmtMonthKey(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
}
function findCatalogueMatch(itemName){
  return catalogue.find(c=>c.nom.toLowerCase()===String(itemName||'').trim().toLowerCase());
}

function resolveItemRefs(items){
  return (items||[]).map(it=>{
    const match = findCatalogueMatch(it.name);
    return match ? { ref: catalogueCol.doc(match.id), qty: Number(it.qty)||0 } : null;
  }).filter(Boolean);
}

// Enregistre une nouvelle commande et décompte immédiatement le matériel correspondant du stock du catalogue.
async function createOrderAndDeductStock(orderData){
  const itemRefs = resolveItemRefs(orderData.items);
  const newOrderRef = ordersCol.doc();
  await db.runTransaction(async (tx)=>{
    const reads = await Promise.all(itemRefs.map(ir=>tx.get(ir.ref)));
    reads.forEach((snap, idx)=>{
      if(!snap.exists) return;
      const current = snap.data().quantite;
      const newQty = (current!=null ? current : 0) - itemRefs[idx].qty;
      tx.update(itemRefs[idx].ref, { quantite:newQty, updatedAt: Date.now() });
    });
    tx.set(newOrderRef, { ...orderData, stockDeducted:true, createdAt: Date.now() });
  });
}

// Supprime une commande en restituant le stock déjà décompté, le cas échéant.
async function deleteOrderAndRestoreStock(order){
  if(!order.stockDeducted){
    try{ await ordersCol.doc(order.id).delete(); }
    catch(err){ console.error(err); alert("La suppression a échoué. Réessayez."); }
    return;
  }
  const itemRefs = resolveItemRefs(order.items);
  try{
    await db.runTransaction(async (tx)=>{
      const reads = await Promise.all(itemRefs.map(ir=>tx.get(ir.ref)));
      reads.forEach((snap, idx)=>{
        if(!snap.exists) return;
        const current = snap.data().quantite;
        const newQty = (current!=null ? current : 0) + itemRefs[idx].qty;
        tx.update(itemRefs[idx].ref, { quantite:newQty, updatedAt: Date.now() });
      });
      tx.delete(ordersCol.doc(order.id));
    });
  }catch(err){
    console.error(err);
    alert("La suppression a échoué. Réessayez.");
  }
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function ordersByDate(iso){
  return orders.filter(o=>o.date===iso).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}

function render(){
  document.getElementById('month-title').textContent = capitalize(fmtMonthTitle(cursor));
  document.getElementById('month-title').style.display = currentView==='cal' ? '' : 'none';
  document.getElementById('prev-month').style.display = currentView==='cal' ? '' : 'none';
  document.getElementById('next-month').style.display = currentView==='cal' ? '' : 'none';
  document.getElementById('today-btn').style.display = currentView==='cal' ? '' : 'none';
  let html;
  if(currentView==='cal') html = renderCalendar();
  else if(currentView==='agenda') html = renderAgenda();
  else html = renderCatalogue();
  document.getElementById('content').innerHTML = html;
  attachContentHandlers();
}

function renderCalendar(){
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstOfMonth = new Date(year,month,1);
  let startOffset = firstOfMonth.getDay(); // 0=Sun
  startOffset = (startOffset+6)%7; // convert to Mon=0
  const startDate = new Date(year,month,1-startOffset);
  const today = todayIso();

  let html = '<div class="cal-grid">';
  DOW.forEach(d=> html += `<div class="cal-dow">${d}</div>`);

  for(let i=0;i<42;i++){
    const d = new Date(startDate); d.setDate(startDate.getDate()+i);
    const iso = isoDate(d);
    const inMonth = d.getMonth()===month;
    const dayOrders = ordersByDate(iso);
    const shown = dayOrders.slice(0,3);
    const extra = dayOrders.length - shown.length;
    html += `
      <div class="cal-cell ${inMonth?'':'other-month'} ${iso===today?'today':''} ${isOrderable(iso)?'':'locked'}" data-date="${iso}">
        <div class="cal-daynum">${d.getDate()}</div>
        <div class="cal-tags">
          ${shown.map(o=>`<div class="cal-tag">${o.horaire?escapeHtml(o.horaire)+' · ':''}${escapeHtml(o.prof)}</div>`).join('')}
          ${extra>0?`<div class="cal-more">+${extra}</div>`:''}
        </div>
      </div>`;
    if(i===41 && d < new Date(year,month+1,0)) { /* ensure full last week shown, loop caps at 42 anyway */ }
  }
  html += '</div>';
  return html;
}

function renderAgenda(){
  const profs = Array.from(new Set(orders.map(o=>o.prof))).sort((a,b)=>a.localeCompare(b,'fr'));
  const classes = Array.from(new Set(orders.map(o=>o.classe).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'fr'));
  const profVal = window._agendaProfFilter || 'tous';
  const classeVal = window._agendaClasseFilter || 'toutes';

  let list = orders.filter(o=>{
    if(profVal!=='tous' && o.prof!==profVal) return false;
    if(classeVal!=='toutes' && o.classe!==classeVal) return false;
    return true;
  }).sort((a,b)=>a.date.localeCompare(b.date));

  window._agendaCurrentList = list;

  let filtersHtml = `
    <div class="agenda-filters">
      <select id="agenda-prof">
        <option value="tous">Tous les professeurs</option>
        ${profs.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}
      </select>
      <select id="agenda-classe">
        <option value="toutes">Toutes les classes</option>
        ${classes.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
      </select>
      <button type="button" class="download-btn" id="download-csv">⬇ Télécharger (${list.length})</button>
    </div>`;

  let body;
  if(list.length===0){
    body = '<div class="empty">Aucune commande ne correspond à ces filtres.</div>';
  }else{
    body = '';
    let currentMonth = null;
    for(const o of list){
      const mk = fmtMonthKey(o.date);
      if(mk!==currentMonth){ body += `<div class="month-heading">${mk}</div>`; currentMonth = mk; }
      body += renderSlip(o);
    }
  }
  return filtersHtml + body;
}

function parseImportText(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.includes('\t') ? line.split('\t') : line.includes(';') ? line.split(';') : line.split(',');
    const nom = (parts[0]||'').trim();
    let quantite = parts[1]!==undefined ? parts[1].trim().replace(',','.') : '';
    quantite = quantite!=='' && !isNaN(Number(quantite)) ? Number(quantite) : null;
    const unite = (parts[2]||'').trim();
    return { nom, quantite, unite };
  }).filter(r=> r.nom && !['nom','article','matériel','materiel'].includes(r.nom.toLowerCase()));
}

function renderImportPreview(rows){
  if(!rows.length) return '<div class="err" style="display:block;">Aucun article valide détecté dans le texte fourni.</div>';
  const existingNames = new Set(catalogue.map(c=>c.nom.toLowerCase()));
  const nbNew = rows.filter(r=>!existingNames.has(r.nom.toLowerCase())).length;
  const nbMaj = rows.length - nbNew;
  return `
    <div class="import-summary">${rows.length} article${rows.length>1?'s':''} détecté${rows.length>1?'s':''} — ${nbNew} nouveau${nbNew>1?'x':''}, ${nbMaj} mise${nbMaj>1?'s':''} à jour.</div>
    <ul class="import-list">
      ${rows.slice(0,40).map(r=>`<li>${escapeHtml(r.nom)}${r.quantite!=null?' — '+r.quantite:''}${r.unite?' '+escapeHtml(r.unite):''}${existingNames.has(r.nom.toLowerCase())?' <span class="import-tag">mise à jour</span>':''}</li>`).join('')}
      ${rows.length>40?`<li>… et ${rows.length-40} de plus</li>`:''}
    </ul>
    <div class="cat-import-actions">
      <button type="button" class="submit-btn" id="confirm-import-btn">Confirmer l'import (${rows.length})</button>
      <button type="button" class="add-item-btn" id="cancel-import-btn">Annuler</button>
    </div>
  `;
}

function renderSlip(o){
  const itemsHtml = (o.items||[]).map(it=>`<li><span>${escapeHtml(it.name)}</span><span class="qty">${it.qty} ${escapeHtml(it.unit)}</span></li>`).join('');
  return `
    <div class="slip">
      <div class="slip-head">
        <div>
          <div class="slip-date">${capitalize(fmtDateLong(o.date))}${o.horaire?' · '+escapeHtml(o.horaire):''}</div>
          <div class="slip-meta"><b>${escapeHtml(o.prof)}</b>${o.classe?' · '+escapeHtml(o.classe):''}${o.salle?' · Salle '+escapeHtml(o.salle):''}</div>
        </div>
      </div>
      ${itemsHtml?`<ul class="items-list">${itemsHtml}</ul>`:''}
      ${o.notes?`<div class="notes">${escapeHtml(o.notes)}</div>`:''}
      <div class="slip-actions">
        <button data-action="print" data-id="${o.id}">imprimer</button>
        <button data-action="delete" data-id="${o.id}">supprimer</button>

}

function attachContentHandlers(){
  document.querySelectorAll('.cal-cell').forEach(cell=>{
    cell.addEventListener('click', ()=> openDayModal(cell.getAttribute('data-date')));
  });
  const profSel = document.getElementById('agenda-prof');
  if(profSel){
    profSel.value = window._agendaProfFilter || 'tous';
    profSel.addEventListener('change', e=>{ window._agendaProfFilter = e.target.value; render(); });
  }
  const classeSel = document.getElementById('agenda-classe');
  if(classeSel){
    classeSel.value = window._agendaClasseFilter || 'toutes';
    classeSel.addEventListener('change', e=>{ window._agendaClasseFilter = e.target.value; render(); });
  }
  const downloadBtn = document.getElementById('download-csv');
  if(downloadBtn){
    downloadBtn.addEventListener('click', ()=> downloadCsv(window._agendaCurrentList || []));
  }
  document.querySelectorAll('[data-action="print"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o) printOrder(o);
    });
  });
  document.querySelectorAll('[data-action="delete"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const o = orders.find(x=>x.id===el.getAttribute('data-id'));
      if(o && confirm(o.stockDeducted ? 'Supprimer cette commande ? Le matériel déjà décompté sera restitué au stock.' : 'Supprimer définitivement cette commande ?')){
        await deleteOrderAndRestoreStock(o);
      }
    });
  });

  const catForm = document.getElementById('cat-form');
  if(catForm){
    catForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const errEl = document.getElementById('cat-err');
      errEl.style.display = 'none';
      const nom = document.getElementById('c-nom').value.trim();
      const qty = document.getElementById('c-qty').value;
      const unite = document.getElementById('c-unit').value;
      if(!nom){
        errEl.textContent = 'Indiquez le nom du matériel.';
        errEl.style.display = 'block';
        return;
      }
      const doublon = catalogue.find(it=>it.nom.toLowerCase()===nom.toLowerCase());
      if(doublon){
        errEl.textContent = 'Cet article existe déjà dans le catalogue. Utilisez « modifier » pour ajuster sa quantité.';
        errEl.style.display = 'block';
        return;
      }
      try{
        await catalogueCol.add({ nom, quantite: qty!==''?Number(qty):null, unite, updatedAt: Date.now() });
        catForm.reset();
      }catch(err){
        errEl.textContent = "L'ajout a échoué. Vérifiez la connexion et réessayez.";
        errEl.style.display = 'block';
      }
    });
  }

  document.querySelectorAll('[data-action="restock-cat"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const it = catalogue.find(x=>x.id===el.getAttribute('data-id'));
      if(!it) return;
      const recu = prompt(`Quantité reçue à ajouter au stock de « ${it.nom} » (${it.unite||'unité'}) :\nStock actuel : ${it.quantite!=null?it.quantite:0}`, '');
      if(recu===null) return;
      const val = Number(recu.trim().replace(',','.'));
      if(!recu.trim() || isNaN(val)){
        alert("Indiquez un nombre valide.");
        return;
      }
      try{
        await catalogueCol.doc(it.id).update({ quantite: (it.quantite!=null?it.quantite:0) + val, updatedAt: Date.now() });
      }catch(err){
        alert("Le réapprovisionnement a échoué. Vérifiez la connexion et réessayez.");
      }
    });
  });

  document.querySelectorAll('[data-action="edit-cat"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const it = catalogue.find(x=>x.id===el.getAttribute('data-id'));
      if(!it) return;
      const nouvelleQte = prompt(`Corriger la quantité exacte pour « ${it.nom} » (${it.unite||'unité'}), par exemple après un inventaire :`, it.quantite!=null?it.quantite:'');
      if(nouvelleQte===null) return;
      const val = nouvelleQte.trim();
      try{
        await catalogueCol.doc(it.id).update({ quantite: val!==''?Number(val):null, updatedAt: Date.now() });
      }catch(err){
        alert("La mise à jour a échoué. Vérifiez la connexion et réessayez.");
      }
    });
  });

  document.querySelectorAll('[data-action="delete-cat"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const it = catalogue.find(x=>x.id===el.getAttribute('data-id'));
      if(it && confirm(`Supprimer « ${it.nom} » du catalogue ?`)){
        await catalogueCol.doc(it.id).delete();
      }
    });
  });

  const importTextarea = document.getElementById('import-text');
  if(importTextarea){
    importTextarea.addEventListener('input', e=>{ importTextValue = e.target.value; });
  }
  const importFile = document.getElementById('import-file');
  if(importFile){
    importFile.addEventListener('change', ()=>{
      const file = importFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        importTextValue = reader.result;
        importPreviewRows = null;
        render();
      };
      reader.readAsText(file, 'UTF-8');
    });
  }
  const analyseBtn = document.getElementById('analyse-import-btn');
  if(analyseBtn){
    analyseBtn.addEventListener('click', ()=>{
      importTextValue = document.getElementById('import-text').value;
      importPreviewRows = parseImportText(importTextValue);
      render();
    });
  }
  const confirmImportBtn = document.getElementById('confirm-import-btn');
  if(confirmImportBtn){
    confirmImportBtn.addEventListener('click', async ()=>{
      confirmImportBtn.disabled = true;
      confirmImportBtn.textContent = 'Import en cours…';
      try{
        await importCatalogueRows(importPreviewRows);
        importPreviewRows = null;
        importTextValue = '';
        render();
      }catch(err){
        alert("L'import a échoué. Vérifiez la connexion et réessayez.");
        confirmImportBtn.disabled = false;
      }
    });
  }
  const cancelImportBtn = document.getElementById('cancel-import-btn');
  if(cancelImportBtn){
    cancelImportBtn.addEventListener('click', ()=>{
      importPreviewRows = null;
      render();
    });
  }
}

async function importCatalogueRows(rows){
  const existingByName = new Map(catalogue.map(c=>[c.nom.toLowerCase(), c]));
  const chunks = [];
  for(let i=0;i<rows.length;i+=400) chunks.push(rows.slice(i,i+400)); // limite de sécurité par lot Firestore (500 max)

  for(const chunk of chunks){
    const batch = db.batch();
    chunk.forEach(r=>{
      const existing = existingByName.get(r.nom.toLowerCase());
      if(existing){
        batch.update(catalogueCol.doc(existing.id), {
          quantite: r.quantite!=null ? r.quantite : existing.quantite,
          unite: r.unite || existing.unite || '',
          updatedAt: Date.now()
        });
      }else{
        const ref = catalogueCol.doc();
        batch.set(ref, { nom: r.nom, quantite: r.quantite, unite: r.unite||'', updatedAt: Date.now() });
      }
    });
    await batch.commit();
  }
}

    <input type="text" placeholder="Nom du matériel" class="it-name" list="materiel-catalogue">
    <input type="number" min="0" step="1" placeholder="Qté" class="it-qty">
    <select class="it-unit">${UNITS.map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
    <button type="button">✕</button>`;
  container.appendChild(row);
  row.querySelector('button').addEventListener('click', ()=> row.remove());
  const nameInput = row.querySelector('.it-name');
  const unitSelect = row.querySelector('.it-unit');
  nameInput.addEventListener('input', ()=>{
    const match = catalogue.find(it=>it.nom.toLowerCase()===nameInput.value.trim().toLowerCase());
    if(match && match.unite) unitSelect.value = match.unite;
  });
}

function updateMaterielDatalist(){
  let dl = document.getElementById('materiel-catalogue');
  if(!dl){
    dl = document.createElement('datalist');
    dl.id = 'materiel-catalogue';
    document.body.appendChild(dl);
  }
  dl.innerHTML = catalogue
    .slice()
    .sort((a,b)=>a.nom.localeCompare(b.nom,'fr'))
    .map(it=>`<option value="${escapeHtml(it.nom)}">${it.quantite!=null?it.quantite+' '+escapeHtml(it.unite||'')+' en stock':''}</option>`)
    .join('');
}

function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function printOrderSlipHtml(o){
  const itemsHtml = (o.items||[]).map(it=>`<tr><td>${escapeHtml(it.name)}</td><td>${it.qty} ${escapeHtml(it.unit||'')}</td></tr>`).join('');
  return `
    <section class="print-slip">
      <div class="print-slip-head">
        <div class="print-slip-date">${capitalize(fmtDateLong(o.date))}${o.horaire?' · '+escapeHtml(o.horaire):''}</div>
        <div class="print-slip-meta">${escapeHtml(o.prof)}${o.classe?' · '+escapeHtml(o.classe):''}${o.salle?' · Salle '+escapeHtml(o.salle):''}</div>
      </div>
      ${itemsHtml?`<table class="print-items"><thead><tr><th>Matériel</th><th>Quantité</th></tr></thead><tbody>${itemsHtml}</tbody></table>`:'<p class="print-empty">Aucun matériel renseigné.</p>'}
      ${o.notes?`<p class="print-notes"><b>Remarques :</b> ${escapeHtml(o.notes)}</p>`:''}
    </section>`;
}

function openPrintWindow(title, bodyHtml){
  const win = window.open('', '_blank', 'width=800,height=900');
  if(!win){ alert("Le navigateur a bloqué la fenêtre d'impression. Autorisez les pop-ups pour ce site."); return; }
  win.document.write(`
    <!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
    <title>${escapeHtml(title)}</title>
    <style>
      body{font-family:'IBM Plex Sans',Arial,sans-serif;color:#1E2B24;margin:24px;}
      h1{font-family:'IBM Plex Mono',monospace;font-size:16px;border-bottom:2px solid #1E2B24;padding-bottom:8px;margin-bottom:18px;}
      .print-slip{border:1px solid #C7CDBB;padding:12px 16px;margin-bottom:16px;page-break-inside:avoid;}
      .print-slip-date{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
      .print-slip-meta{font-size:13px;color:#52604F;margin-top:2px;}
      .print-items{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
      .print-items th{text-align:left;border-bottom:1px solid #1E2B24;padding:4px 6px;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;}
      .print-items td{border-bottom:1px dotted #C7CDBB;padding:4px 6px;}
      .print-notes{font-size:13px;font-style:italic;margin-top:10px;}
      .print-empty{font-size:13px;color:#8A9184;margin-top:10px;}
      @media print{ body{margin:0.5cm;} }
    </style></head>
    <body>
      <h1>${escapeHtml(title)}</h1>
      ${bodyHtml}
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>{ try{ win.print(); }catch(e){} }, 250);
}

function printOrder(o){
  openPrintWindow(`Commande TP — ${fmtDateLong(o.date)}`, printOrderSlipHtml(o));
}

function printDay(iso, dayOrders){
  if(!dayOrders || dayOrders.length===0) return;
  const body = dayOrders.map(printOrderSlipHtml).join('');
  openPrintWindow(`Commandes TP — ${fmtDateLong(iso)}`, body);
}

function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[";\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function downloadCsv(list){
  if(!list || list.length===0){
    alert("Aucune commande à télécharger avec ces filtres.");
    return;
  }
  const headers = ['Date','Horaire','Salle','Professeur','Classe','Matériel','Quantité','Unité','Remarques'];
  const rows = [headers];

  list.forEach(o=>{
    const base = [o.date, o.horaire||'', o.salle||'', o.prof||'', o.classe||''];
    if(o.items && o.items.length){
      o.items.forEach(it=>{
        rows.push([...base, it.name, it.qty, it.unit, o.notes||'']);
      });
    }else{
      rows.push([...base, '', '', '', o.notes||'']);
    }
  });

  const csvContent = rows.map(r=>r.map(csvEscape).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `commandes-tp-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
